<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Arquivos - PIVOT Deal Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f8f8; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #000; font-weight: 700; }
        .nav { display: flex; gap: 20px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
        .nav a { padding: 8px 16px; text-decoration: none; color: #666; font-weight: 600; border-radius: 6px; }
        .nav a:hover, .nav a.active { background: #000; color: white; }
        .upload-zone { background: white; padding: 40px; border: 2px dashed #667eea; border-radius: 12px; text-align: center; margin-bottom: 30px; }
        .upload-zone:hover { border-color: #000; background: #f9f9f9; }
        .upload-zone p { color: #666; margin: 10px 0; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #000; color: white; }
        .btn-secondary { background: white; color: #000; border: 2px solid #000; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 12px; overflow: hidden; }
        th { background: #f5f5f5; padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0; }
        td { padding: 15px; border-bottom: 1px solid #e0e0e0; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-yellow { background: #fff3e0; color: #e65100; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Controle de Arquivos</h1>
            <div class="nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/arquivos" class="active">📁 Arquivos</a>
                <a href="/orcamento">💰 Orçamento</a>
                <a href="javascript:logout()" style="margin-left: auto;">Sair</a>
            </div>
        </div>

        <div class="upload-zone" ondrop="handleDrop(event)" ondragover="event.preventDefault()" ondragleave="event.preventDefault()">
            <p style="font-size: 24px;">📤</p>
            <p><strong>Arraste arquivos aqui</strong></p>
            <p style="font-size: 12px; color: #999;">ou clique para selecionar</p>
            <input type="file" id="fileInput" multiple style="display: none;">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Selecionar Arquivos</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Arquivo</th>
                    <th>Tamanho</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>apresentacao_comercial.xlsx</td>
                    <td>2.4 MB</td>
                    <td>15/10/2026</td>
                    <td><span class="badge badge-green">Compartilhado</span></td>
                    <td><button class="btn" style="background: #e3f2fd; color: #1565c0; border: none; padding: 4px 8px;">Gerenciar</button></td>
                </tr>
                <tr>
                    <td>propostas_outubro.pdf</td>
                    <td>1.8 MB</td>
                    <td>14/10/2026</td>
                    <td><span class="badge badge-yellow">Novo</span></td>
                    <td><button class="btn" style="background: #e3f2fd; color: #1565c0; border: none; padding: 4px 8px;">Compartilhar</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = '/login';
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('usuario');
            window.location.href = '/login';
        }

        function handleDrop(e) {
            e.preventDefault();
            alert('Upload de arquivos em desenvolvimento');
        }
    </script>
</body>
</html>
