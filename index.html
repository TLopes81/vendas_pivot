<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIVOT Deal Manager</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== LOGIN ===== */
    .login-container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      margin: 0 auto;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .demo-users {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #666;
    }

    .demo-users strong {
      display: block;
      margin-bottom: 10px;
      color: #333;
    }

    .demo-user {
      padding: 8px;
      margin: 4px 0;
      background: #f5f5f5;
      border-radius: 4px;
    }

    /* ===== DASHBOARD ===== */
    .dashboard {
      background: #f5f7fa;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      color: #333;
      font-size: 24px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .user-nivel {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
    }

    .btn-logout {
      margin-top: 10px;
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .kpi-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-left: 4px solid #667eea;
    }

    .kpi-card h3 {
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: #333;
    }

    .projects-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .projects-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .projects-table {
      width: 100%;
      border-collapse: collapse;
    }

    .projects-table thead {
      background: #f5f7fa;
    }

    .projects-table th {
      padding: 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      border-bottom: 2px solid #ddd;
    }

    .projects-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      color: #333;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-em_negociacao {
      background: #fef3cd;
      color: #856404;
    }

    .status-aprovado {
      background: #d4edda;
      color: #155724;
    }

    .status-perdido {
      background: #f8d7da;
      color: #721c24;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      background: #667eea;
      color: white;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 0;
    }

    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API_URL = 'http://localhost:3001/api';

    function App() {
      const [usuario, setUsuario] = React.useState(null);
      const [email, setEmail] = React.useState('silvio@pivot.com');
      const [senha, setSenha] = React.useState('123456');
      const [erro, setErro] = React.useState('');
      const [projetos, setProjetos] = React.useState([]);
      const [dashboard, setDashboard] = React.useState(null);

      // ===== LOGIN =====
      const handleLogin = async (e) => {
        e.preventDefault();
        setErro('');

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
          });

          if (!res.ok) throw new Error('Credenciais inválidas');

          const user = await res.json();
          setUsuario(user);
          carregarDashboard(user.id, user.nivel);
        } catch (err) {
          setErro(err.message);
        }
      };

      const carregarDashboard = async (usuario_id, nivel) => {
        try {
          const res = await fetch(`${API_URL}/dashboard/${usuario_id}/${nivel}`);
          const data = await res.json();
          setDashboard(data);
          setProjetos(data.projetos || []);
        } catch (err) {
          setErro('Erro ao carregar dashboard');
        }
      };

      const handleLogout = () => {
        setUsuario(null);
        setProjetos([]);
        setDashboard(null);
        setEmail('silvio@pivot.com');
        setSenha('123456');
      };

      if (!usuario) {
        return (
          <div className="login-container">
            <div className="login-header">
              <h1>📊 PIVOT Deal Manager</h1>
              <p>Sistema de Gestão de Propostas</p>
            </div>

            {erro && <div className="error">❌ {erro}</div>}

            <form onSubmit={handleLogin}>
              <div className="form-group">
                <label>Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label>Senha</label>
                <input
                  type="password"
                  value={senha}
                  onChange={(e) => setSenha(e.target.value)}
                  required
                />
              </div>

              <button className="btn btn-primary">Entrar</button>
            </form>

            <div className="demo-users">
              <strong>👥 Usuários de Demo:</strong>
              <div className="demo-user"><strong>Diretor:</strong> silvio@pivot.com / 123456</div>
              <div className="demo-user"><strong>Gerente:</strong> tiago@pivot.com / 123456</div>
              <div className="demo-user"><strong>Gerente:</strong> joao@pivot.com / 123456</div>
              <div className="demo-user"><strong>Vendedor:</strong> v1@pivot.com / 123456</div>
            </div>
          </div>
        );
      }

      return (
        <div className="dashboard">
          <div className="header">
            <h1>📊 PIVOT Deal Manager</h1>
            <div className="user-info">
              <div className="user-name">{usuario.nome}</div>
              <div className="user-nivel">{usuario.nivel}</div>
              <button className="btn-logout" onClick={handleLogout}>Sair</button>
            </div>
          </div>

          {dashboard && (
            <>
              <div className="kpi-cards">
                <div className="kpi-card">
                  <h3>📊 Total de Propostas</h3>
                  <div className="kpi-value">{dashboard.total}</div>
                </div>

                <div className="kpi-card">
                  <h3>🕐 Em Negociação</h3>
                  <div className="kpi-value">{dashboard.em_negociacao}</div>
                </div>

                <div className="kpi-card">
                  <h3>✅ Aprovados</h3>
                  <div className="kpi-value">{dashboard.aprovados}</div>
                </div>

                <div className="kpi-card">
                  <h3>💰 Valor Total</h3>
                  <div className="kpi-value">R$ {(dashboard.valor_total || 0).toLocaleString('pt-BR')}</div>
                </div>

                <div className="kpi-card">
                  <h3>📈 Margem Média</h3>
                  <div className="kpi-value">{dashboard.margem_media}%</div>
                </div>
              </div>

              <div className="projects-section">
                <h2>📋 Propostas</h2>
                {dashboard.projetos && dashboard.projetos.length > 0 ? (
                  <table className="projects-table">
                    <thead>
                      <tr>
                        <th>Cliente</th>
                        <th>Fazenda</th>
                        <th>Valor</th>
                        <th>Margem</th>
                        <th>Status</th>
                        <th>Ações</th>
                      </tr>
                    </thead>
                    <tbody>
                      {dashboard.projetos.map((p) => (
                        <tr key={p.id}>
                          <td><strong>{p.cliente}</strong></td>
                          <td>{p.fazenda}</td>
                          <td>R$ {(p.valor || 0).toLocaleString('pt-BR')}</td>
                          <td>{p.margem || '-'}%</td>
                          <td>
                            <span className={`status-badge status-${p.status}`}>
                              {p.status === 'em_negociacao' && '🕐 Em Negociação'}
                              {p.status === 'aprovado' && '✅ Aprovado'}
                              {p.status === 'perdido' && '❌ Perdido'}
                            </span>
                          </td>
                          <td>
                            <button className="action-btn">Ver Detalhes</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                ) : (
                  <div className="no-data">Nenhuma proposta criada ainda</div>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
