// Status da negociacao: Negociando -> Concluido como Ganho / Concluido como
// Perdido. Motivo e obrigatorio so quando perde (Valor, Concorrencia -- com
// qual marca --, Prazo de entrega, Relacionamento/confianca, Projeto
// cancelado pelo cliente, Outro com texto livre).
function StatusProjeto(props) {
  const p = props.projeto;
  const [editando, setEditando] = useState(false);
  const [statusEscolhido, setStatusEscolhido] = useState(null);
  const [categoria, setCategoria] = useState(p.motivo_perda_categoria || '');
  const [concorrente, setConcorrente] = useState(p.motivo_perda_concorrente || '');
  const [detalhe, setDetalhe] = useState(p.motivo_perda_detalhe || '');
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState(null);

  function iniciarMudanca(novoStatus) {
    setErro(null);
    if (novoStatus === 'concluido_perdido') {
      setStatusEscolhido(novoStatus);
      setEditando(true);
    } else {
      salvar(novoStatus, {});
    }
  }

  function salvar(novoStatus, motivo) {
    setSalvando(true);
    setErro(null);
    api('/projetos/' + p.id, { method: 'PUT', body: JSON.stringify(Object.assign({ status: novoStatus }, motivo)) }, props.token)
      .then(function () { setEditando(false); props.onChange(); })
      .catch(function (e) { setErro(e.message); })
      .then(function () { setSalvando(false); });
  }

  function confirmarPerdido() {
    if (!categoria) { setErro('Escolha o motivo da perda.'); return; }
    if (categoria === 'concorrencia' && !concorrente) { setErro('Escolha qual concorrente.'); return; }
    if (categoria === 'outro' && !detalhe.trim()) { setErro('Descreva o motivo.'); return; }
    salvar('concluido_perdido', {
      motivo_perda_categoria: categoria,
      motivo_perda_concorrente: categoria === 'concorrencia' ? concorrente : null,
      motivo_perda_detalhe: detalhe || null
    });
  }

  if (!props.podeEditar) {
    return <span className={'tag ' + p.status}>{formatarStatus(p.status)}</span>;
  }

  if (p.status !== 'negociando' && !editando) {
    // Ja concluido -- mostra o status + motivo (se perdido) + opcao de reabrir.
    return (
      <div className="row" style={{ flexWrap: 'wrap', alignItems: 'center' }}>
        <span className={'tag ' + p.status}>{formatarStatus(p.status)}</span>
        {p.status === 'concluido_perdido' && p.motivo_perda_categoria ? (
          <span className="muted" style={{ fontSize: '12px' }}>
            Motivo: {ROTULOS_MOTIVO_PERDA[p.motivo_perda_categoria] || p.motivo_perda_categoria}
            {p.motivo_perda_concorrente ? ' — ' + p.motivo_perda_concorrente : ''}
            {p.motivo_perda_detalhe ? ' — ' + p.motivo_perda_detalhe : ''}
          </span>
        ) : null}
        <button className="mini ghost" disabled={salvando} onClick={function () { salvar('negociando', {}); }}>Reabrir negociação</button>
      </div>
    );
  }

  if (editando) {
    return (
      <div className="panel" style={{ background: '#fff1f2', borderColor: '#f3c6cd' }}>
        <p style={{ margin: '0 0 8px', fontWeight: 600 }}>Marcar como Concluído como Perdido -- qual o motivo?</p>
        <div className="grid-campos">
          <div>
            <label>Motivo</label>
            <select value={categoria} onChange={function (e) { setCategoria(e.target.value); }}>
              <option value="">Selecione...</option>
              {Object.keys(ROTULOS_MOTIVO_PERDA).map(function (k) { return <option key={k} value={k}>{ROTULOS_MOTIVO_PERDA[k]}</option>; })}
            </select>
          </div>
          {categoria === 'concorrencia' ? (
            <div>
              <label>Concorrente</label>
              <select value={concorrente} onChange={function (e) { setConcorrente(e.target.value); }}>
                <option value="">Selecione...</option>
                {CONCORRENTES.map(function (c) { return <option key={c} value={c}>{c}</option>; })}
              </select>
            </div>
          ) : null}
        </div>
        <div style={{ marginTop: '8px' }}>
          <label>{categoria === 'outro' ? 'Descreva o motivo' : 'Observação (opcional)'}</label>
          <input type="text" style={{ width: '100%' }} value={detalhe} onChange={function (e) { setDetalhe(e.target.value); }} />
        </div>
        {erro ? <div className="err" style={{ marginTop: '8px' }}>{erro}</div> : null}
        <div className="row" style={{ marginTop: '10px' }}>
          <button onClick={confirmarPerdido} disabled={salvando}>{salvando ? 'Salvando...' : 'Confirmar perda'}</button>
          <button className="ghost" onClick={function () { setEditando(false); setErro(null); }} disabled={salvando}>Cancelar</button>
        </div>
      </div>
    );
  }

  return (
    <div className="row" style={{ flexWrap: 'wrap', alignItems: 'center' }}>
      <span className={'tag ' + p.status}>{formatarStatus(p.status)}</span>
      <button className="mini ghost" disabled={salvando} onClick={function () { iniciarMudanca('concluido_ganho'); }}>Marcar Ganho</button>
      <button className="mini ghost" disabled={salvando} onClick={function () { iniciarMudanca('concluido_perdido'); }}>Marcar Perdido</button>
      {erro ? <span className="err" style={{ fontSize: '11px' }}>{erro}</span> : null}
    </div>
  );
}

// Itens adicionais da NEGOCIACAO que ficam FORA de qualquer pivo --
// bombeamento/PVC/cabos eletricos vendidos avulsos, cada um com seu PROPRIO
// desconto/encargos/taxa flat/servicos adicionais (diferente entre si e
// diferente dos parametros gerais do pivo, acima). So existe quando esse
// item NAO esta embutido no preco de nenhum pivo (.xlsb) do projeto.
const FORNECEDORES_PVC = ['Tigre', 'Amanco', 'Corplastic', 'Outro'];

function ItensAdicionaisProjeto(props) {
  const itens = props.itens || [];
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novoTipo, setNovoTipo] = useState('bombeamento');
  const [novoValor, setNovoValor] = useState('');
  const [novoFornecedor, setNovoFornecedor] = useState('Tigre');
  const [arquivoPdf, setArquivoPdf] = useState(null);
  const [extraindo, setExtraindo] = useState(false);
  const [extracaoMsg, setExtracaoMsg] = useState(null);
  const [erro, setErro] = useState(null);
  const [salvando, setSalvando] = useState(false);

  async function aoSelecionarPdf(ev) {
    const arquivo = ev.target.files && ev.target.files[0];
    if (!arquivo) return;
    setArquivoPdf(arquivo);
    setExtracaoMsg(null);
    setExtraindo(true);
    try {
      const fd = new FormData();
      fd.append('arquivo', arquivo, arquivo.name);
      fd.append('fornecedor', novoFornecedor);
      const r = await api('/itens-adicionais/extrair-pdf', { method: 'POST', body: fd }, props.token);
      if (r.valor) {
        setNovoValor(numero(r.valor, 2));
        setExtracaoMsg('Valor extraído automaticamente do PDF (' + r.origem + '): confira antes de adicionar.');
      } else {
        setExtracaoMsg('Não consegui extrair o valor automaticamente desse PDF -- preencha "Valor base" manualmente. O arquivo fica anexado ao item mesmo assim.');
      }
    } catch (e) {
      setExtracaoMsg('Não consegui ler esse PDF automaticamente -- preencha "Valor base" manualmente. O arquivo fica anexado ao item mesmo assim.');
    }
    setExtraindo(false);
  }

  function adicionar() {
    const valor = parseFloat(String(novoValor).replace(/\./g, '').replace(',', '.'));
    if (!valor || valor <= 0) { setErro('Informe um valor.'); return; }
    setSalvando(true);
    setErro(null);
    api('/itens-adicionais', {
      method: 'POST',
      body: JSON.stringify(Object.assign({ projeto_id: props.projetoId, tipo: novoTipo, valor: valor },
        novoTipo === 'pvc' ? { fornecedor: novoFornecedor, arquivo_nome_original: arquivoPdf ? arquivoPdf.name : null } : {}))
    }, props.token)
      .then(function (item) {
        if (arquivoPdf) {
          const fd = new FormData();
          fd.append('arquivo', arquivoPdf, arquivoPdf.name);
          fd.append('projeto_id', props.projetoId);
          fd.append('item_adicional_id', item.id);
          fd.append('tipo', 'item_adicional');
          return api('/arquivos', { method: 'POST', body: fd }, props.token);
        }
      })
      .then(function () { setMostrarForm(false); setNovoValor(''); setArquivoPdf(null); setExtracaoMsg(null); props.onChange(); })
      .catch(function (e) { setErro(e.message); })
      .then(function () { setSalvando(false); });
  }

  function excluir(id) {
    api('/itens-adicionais/' + id, { method: 'DELETE' }, props.token)
      .then(function () { props.onChange(); })
      .catch(function (e) { alert('Erro ao excluir: ' + e.message); });
  }

  return (
    <div className="panel">
      <div className="row" style={{ justifyContent: 'space-between' }}>
        <h2 style={{ margin: 0 }}>Itens adicionais (avulsos)</h2>
        {props.podeEditar ? <button className="mini ghost" onClick={function () { setMostrarForm(!mostrarForm); }}>{mostrarForm ? 'Cancelar' : '+ Adicionar item'}</button> : null}
      </div>
      <p className="muted" style={{ marginTop: '4px', marginBottom: '12px' }}>
        Bombeamento, PVC ou cabos elétricos vendidos separados de qualquer pivô — cada item tem seu próprio desconto/encargos/taxa flat, diferentes entre si e dos parâmetros do pivô acima.
      </p>

      {mostrarForm ? (
        <div style={{ marginBottom: '12px' }}>
          <div className="grid-campos">
            <div>
              <label>Tipo</label>
              <select value={novoTipo} onChange={function (e) { setNovoTipo(e.target.value); }}>
                {Object.keys(ROTULOS_TIPO_ITEM).map(function (k) { return <option key={k} value={k}>{ROTULOS_TIPO_ITEM[k]}</option>; })}
              </select>
            </div>
            {novoTipo === 'pvc' ? (
              <div>
                <label>Fornecedor</label>
                <select value={novoFornecedor} onChange={function (e) { setNovoFornecedor(e.target.value); }}>
                  {FORNECEDORES_PVC.map(function (f) { return <option key={f} value={f}>{f}</option>; })}
                </select>
              </div>
            ) : null}
            <div>
              <label>Valor base (R$)</label>
              <input className="campo-mini campo-monetario" type="text" inputMode="decimal" value={novoValor} onChange={function (e) { setNovoValor(e.target.value); }} placeholder="0,00" />
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-end' }}>
              <button onClick={adicionar} disabled={salvando}>{salvando ? 'Adicionando...' : 'Adicionar'}</button>
            </div>
          </div>
          {novoTipo === 'pvc' ? (
            <div style={{ marginTop: '8px' }}>
              <label>Orçamento do fornecedor em PDF (opcional -- {novoFornecedor === 'Tigre' ? 'valor extraído automaticamente' : 'preencha o valor manualmente'})</label>
              <input type="file" accept=".pdf" onChange={aoSelecionarPdf} disabled={extraindo} />
              {extraindo ? <p className="muted" style={{ fontSize: '11px' }}>Lendo PDF...</p> : null}
              {extracaoMsg ? <p className="muted" style={{ fontSize: '11px' }}>{extracaoMsg}</p> : null}
            </div>
          ) : null}
        </div>
      ) : null}
      {erro ? <div className="err" style={{ marginBottom: '8px' }}>{erro}</div> : null}

      {itens.length === 0 ? (
        <p className="muted">Nenhum item avulso -- use "+ Adicionar item" se o projeto tiver bombeamento, PVC ou cabos elétricos vendidos separados de algum pivô.</p>
      ) : (
        <div style={{ overflowX: 'auto' }}>
        <table>
          <thead>
            <tr><th>Tipo</th><th>Valor base</th><th>Encargos</th><th>Desconto</th><th>Taxa Flat</th><th>Serv. Adicionais</th><th>Valor Calculado</th><th></th></tr>
          </thead>
          <tbody>
            {itens.map(function (item) {
              return <LinhaItemAdicional key={item.id} item={item} token={props.token} podeEditar={props.podeEditar} onChange={props.onChange} onExcluir={excluir} />;
            })}
          </tbody>
        </table>
        </div>
      )}
    </div>
  );
}

function LinhaItemAdicional(props) {
  const item = props.item;
  const valoresDoItem = function (it) {
    return { valor: it.valor, encargos_pct: it.encargos_pct, desconto_pct: it.desconto_pct, taxa_flat_pct: it.taxa_flat_pct, servicos_adicionais: it.servicos_adicionais };
  };
  const [campos, setCampos] = useState(valoresDoItem(item));
  const [salvando, setSalvando] = useState(false);
  const salvoRef = React.useRef(valoresDoItem(item));

  useEffect(function () {
    const v = valoresDoItem(item);
    setCampos(v);
    salvoRef.current = v;
  }, [item.valor, item.encargos_pct, item.desconto_pct, item.taxa_flat_pct, item.servicos_adicionais]);

  function salvarCampos(novosCampos) {
    const mudou = Object.keys(novosCampos).some(function (k) { return Number(novosCampos[k]) !== Number(salvoRef.current[k]); });
    setCampos(novosCampos);
    if (!mudou) return;
    setSalvando(true);
    api('/itens-adicionais/' + item.id, { method: 'PUT', body: JSON.stringify(novosCampos) }, props.token)
      .then(function () { salvoRef.current = novosCampos; props.onChange(); })
      .catch(function (e) { alert('Erro ao salvar: ' + e.message); })
      .then(function () { setSalvando(false); });
  }

  const soLeitura = !props.podeEditar;
  const campo = function (nome, Componente) {
    return (
      <td>
        <Componente
          value={campos[nome]} disabled={soLeitura}
          onCommit={function (n) { salvarCampos(Object.assign({}, campos, { [nome]: n })); }}
        />
      </td>
    );
  };

  return (
    <tr>
      <td>
        {ROTULOS_TIPO_ITEM[item.tipo] || item.tipo}
        {item.fornecedor ? <div className="muted" style={{ fontSize: '11px' }}>{item.fornecedor}{item.arquivo_nome_original ? ' · ' + item.arquivo_nome_original : ''}</div> : null}
        {item.descricao ? <div className="muted" style={{ fontSize: '11px' }}>{item.descricao}</div> : null}
      </td>
      {campo('valor', CampoMonetario)}
      {campo('encargos_pct', CampoPercentual)}
      {campo('desconto_pct', CampoPercentual)}
      {campo('taxa_flat_pct', CampoPercentual)}
      {campo('servicos_adicionais', CampoMonetario)}
      <td><strong>{brl(item.valor_calculado)}</strong>{salvando ? <div className="muted" style={{ fontSize: '10px' }}>salvando…</div> : null}</td>
      <td>{props.podeEditar ? <button className="mini ghost" onClick={function () { props.onExcluir(item.id); }}>🗑️</button> : null}</td>
    </tr>
  );
}

// Parametros comerciais da NEGOCIACAO -- Encargos/Desconto/Taxa Flat/
// Montagem/Serviços Adicionais são UM valor só para o projeto inteiro
// (nunca por pivô/equipamento). ZERO digitação manual: vêm direto da(s)
// planilha(s) .xlsb de pivô enviadas (linha "Sub Total D - PIVÔ" da aba
// PROPOSTA) -- Encargos/Desconto/Taxa Flat são sincronizados a cada envio,
// Montagem/Serv. Adicionais são a SOMA do valor de cada pivô enviado.
// Por isso o painel aqui é só leitura -- reenviar a planilha (nova revisão)
// atualiza esses valores automaticamente.
// Parametros comerciais da negociacao: cada upload de planilha de pivo
// RESSINCRONIZA estes 5 campos com os valores reais do pedido (ver POST
// /pivos no servidor) -- isso garante que eles nunca ficam desatualizados
// em relacao ao pedido oficial. Entre um upload e outro, porem, o vendedor
// edita livremente aqui pra simular cenarios de desconto/margem na hora
// (ex. "e se eu desse mais 5% de desconto?") sem precisar mexer na
// planilha -- e exatamente o uso que a Calculadora comercial ja permitia.
function ParametrosComerciaisProjeto(props) {
  const p = props.projeto;
  const valoresDoProjeto = function (proj) {
    return {
      encargos_pct: proj.encargos_pct, desconto_pct: proj.desconto_pct, taxa_flat_pct: proj.taxa_flat_pct,
      montagem: proj.montagem, servicos_adicionais: proj.servicos_adicionais
    };
  };
  const [campos, setCampos] = useState(valoresDoProjeto(p));
  const [salvando, setSalvando] = useState(false);
  const salvoRef = React.useRef(valoresDoProjeto(p));

  useEffect(function () {
    const v = valoresDoProjeto(p);
    setCampos(v);
    salvoRef.current = v;
  }, [p.encargos_pct, p.desconto_pct, p.taxa_flat_pct, p.montagem, p.servicos_adicionais]);

  function salvarCampos(novosCampos) {
    const mudou = Object.keys(novosCampos).some(function (k) { return Number(novosCampos[k]) !== Number(salvoRef.current[k]); });
    setCampos(novosCampos);
    if (!mudou) return;
    setSalvando(true);
    api('/projetos/' + p.id + '/comercial', { method: 'PUT', body: JSON.stringify(novosCampos) }, props.token)
      .then(function () { salvoRef.current = novosCampos; props.onChange(); })
      .catch(function (e) { alert('Erro ao salvar: ' + e.message); })
      .then(function () { setSalvando(false); });
  }

  const soLeitura = !props.podeEditar;
  const campoComercial = function (nome, rotulo, Componente) {
    return (
      <div>
        <label>{rotulo}</label>
        <Componente
          value={campos[nome]}
          disabled={soLeitura}
          onCommit={function (n) { salvarCampos(Object.assign({}, campos, { [nome]: n })); }}
        />
      </div>
    );
  };

  return (
    <div className="panel">
      <div className="row" style={{ justifyContent: 'space-between' }}>
        <h2 style={{ margin: 0 }}>Parâmetros comerciais da negociação</h2>
        {salvando ? <span className="muted" style={{ fontSize: '12px' }}>salvando…</span> : null}
      </div>
      <p className="muted" style={{ marginTop: '4px', marginBottom: '12px' }}>
        Únicos para toda a negociação (não por pivô/equipamento). A cada planilha de pivô enviada, estes 5 campos são ressincronizados com o pedido real — entre um envio e outro, edite à vontade aqui pra simular desconto/margem (clique no campo, digite por cima e saia): recalcula o valor negociado na hora, sem mexer na planilha.
      </p>
      <div className="grid-campos">
        {campoComercial('encargos_pct', 'Encargos', CampoPercentual)}
        {campoComercial('desconto_pct', 'Desconto', CampoPercentual)}
        {campoComercial('taxa_flat_pct', 'Taxa Flat', CampoPercentual)}
        {campoComercial('montagem', 'Montagem (total da negociação)', CampoMonetario)}
        {campoComercial('servicos_adicionais', 'Serv. Adicionais (total da negociação)', CampoMonetario)}
      </div>
      {props.resumo ? (
        <div className="kpis" style={{ marginTop: '16px', marginBottom: 0 }}>
          <div className="kpi">
            <span>Valor total negociado</span>
            <strong>{brl(props.resumo.valor_total || 0)}</strong>
          </div>
        </div>
      ) : null}
    </div>
  );
}

function ProjetoDetalhe(props) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);
  const [versao, setVersao] = useState(0);

  const carregar = useCallback(function () {
    api('/projetos/' + props.projetoId + '/resumo', {}, props.token)
      .then(function (d) { setDados(d); if (props.onCarregado) props.onCarregado(d.projeto); })
      .catch(function (e) { setErro(e.message); });
    setVersao(function (v) { return v + 1; });
  }, [props.projetoId, props.token]);

  useEffect(function () { carregar(); }, [props.projetoId]);

  const podeEditar = props.usuario.nivel === 'gerente' || props.usuario.nivel === 'diretor' || props.usuario.nivel === 'vendedor';

  if (erro) return <div className="err">{erro}</div>;
  if (!dados) return <p className="muted">Carregando...</p>;

  const p = dados.projeto;
  const r = dados.resumo;
  const secao = props.secao || 'visao-geral';

  return (
    <div>
      <button className="voltar" onClick={props.onVoltar}>&larr; Voltar aos projetos</button>

      <div className="panel">
        <h2>{p.cliente}</h2>
        <p className="muted" style={{ marginBottom: '8px' }}>
          {p.fazenda ? p.fazenda + ' — ' : ''}{p.municipio ? p.municipio + '/' : ''}{p.estado || ''}
        </p>
        <StatusProjeto token={props.token} projeto={p} podeEditar={podeEditar} onChange={carregar} />
        <p className="muted" style={{ margin: '8px 0 0' }}>
          {r.qtde_pivos} pivô{r.qtde_pivos === 1 ? '' : 's'} &middot; {numero(r.area_total_ha, 1)} ha &middot; {brl(r.valor_total)} negociado &middot; {brl(r.custo_por_hectare_medio)}/ha
        </p>
      </div>

      {secao === 'visao-geral' ? (
        <React.Fragment>
          <div className="kpis">
            <div className="kpi"><span>Pivôs</span><strong>{r.qtde_pivos}</strong></div>
            <div className="kpi"><span>Área total</span><strong>{numero(r.area_total_ha, 1)} ha</strong></div>
            <div className="kpi"><span>Valor negociado</span><strong>{brl(r.valor_total)}</strong></div>
            <div className="kpi"><span>Custo/ha</span><strong>{brl(r.custo_por_hectare_medio)}</strong></div>
          </div>
          <ResumoTecnico resumo={r} />
        </React.Fragment>
      ) : null}

      {secao === 'parametros' ? (
        <ParametrosComerciaisProjeto token={props.token} projeto={p} resumo={r} podeEditar={podeEditar} onChange={carregar} />
      ) : null}

      {secao === 'itens' ? (
        <ItensAdicionaisProjeto token={props.token} projetoId={p.id} itens={dados.itens_adicionais} podeEditar={podeEditar} onChange={carregar} />
      ) : null}

      {secao === 'pivos' ? (
        <React.Fragment>
          <EnviarPivo token={props.token} projeto={p} onChange={carregar} />
          <div className="panel">
            <h2>Pivôs</h2>
            <p className="muted" style={{ marginTop: '-6px', marginBottom: '10px' }}>
              Valor negociado de cada pivô, já com os parâmetros comerciais da negociação (seção "Parâmetros comerciais") aplicados.
            </p>
            <div style={{ overflowX: 'auto' }}>
            <table>
              <thead>
                <tr>
                  <th>Nº Pivô</th><th>Composição</th><th>Área</th>
                  <th>Valor Negociado</th><th>Custo/ha</th><th>Versão</th>
                </tr>
              </thead>
              <tbody>
                {dados.pivos.map(function (piv) {
                  return <LinhaPivo key={piv.id} pivo={piv} token={props.token} podeEditar={podeEditar} onChange={carregar} />;
                })}
                {dados.pivos.length === 0 ? <tr><td colSpan={6} className="muted">Nenhum pivô ainda. Envie a primeira planilha acima.</td></tr> : null}
              </tbody>
            </table>
            </div>
          </div>
        </React.Fragment>
      ) : null}

      {secao === 'proposta' ? (
        <ResumoComercial projeto={p} pivos={dados.pivos} itensAdicionais={dados.itens_adicionais} resumo={r} />
      ) : null}

      {secao === 'arquivos' ? (
        <ArquivosDoProjeto projetoId={props.projetoId} token={props.token} versao={versao} pivos={dados.pivos} usuario={props.usuario} />
      ) : null}
    </div>
  );
}

// Modal generico de confirmacao -- em vez de window.confirm nativo, que em
// vários navegadores/contextos nao aparece ou e descartado silenciosamente
// (dando a impressao de que o botao "nao faz nada" ao clicar).
function ModalConfirmacao(props) {
  return (
    <div
      style={{ position: 'fixed', inset: 0, background: 'rgba(25,27,33,.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}
      onClick={function (ev) { ev.stopPropagation(); if (!props.confirmando) props.onCancelar(); }}
    >
      <div className="card" style={{ maxWidth: '360px' }} onClick={function (ev) { ev.stopPropagation(); }}>
        <h1 style={{ fontSize: '16px' }}>{props.titulo}</h1>
        <p className="sub">{props.mensagem}</p>
        {props.erro ? <div className="err">{props.erro}</div> : null}
        <div className="row" style={{ justifyContent: 'flex-end', marginTop: '16px' }}>
          <button className="ghost" onClick={props.onCancelar} disabled={props.confirmando}>Cancelar</button>
          <button style={{ background: '#9f1239' }} onClick={props.onConfirmar} disabled={props.confirmando}>
            {props.confirmando ? 'Excluindo...' : 'Excluir'}
          </button>
        </div>
      </div>
    </div>
  );
}

// Modal de troca da PROPRIA senha -- qualquer usuario logado, exige a
// senha atual. (Reset de senha de OUTRO usuario, por gerente/diretor, fica
// na tela Admin > Usuarios, ver BotaoRedefinirSenha abaixo.)
function ModalTrocarSenha(props) {
  const [senhaAtual, setSenhaAtual] = useState('');
  const [senhaNova, setSenhaNova] = useState('');
  const [confirmarNova, setConfirmarNova] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState(null);
  const [ok, setOk] = useState(false);

  function salvar() {
    setErro(null);
    if (senhaNova.length < 6) { setErro('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
    if (senhaNova !== confirmarNova) { setErro('As duas senhas novas não são iguais.'); return; }
    setEnviando(true);
    api('/me/senha', { method: 'PUT', body: JSON.stringify({ senha_atual: senhaAtual, senha_nova: senhaNova }) }, props.token)
      .then(function () { setOk(true); })
      .catch(function (e) { setErro(e.message); })
      .then(function () { setEnviando(false); });
  }

  return (
    <div
      style={{ position: 'fixed', inset: 0, background: 'rgba(25,27,33,.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}
      onClick={function (ev) { ev.stopPropagation(); if (!enviando) props.onFechar(); }}
    >
      <div className="card" style={{ maxWidth: '360px' }} onClick={function (ev) { ev.stopPropagation(); }}>
        <h1 style={{ fontSize: '16px' }}>Trocar minha senha</h1>
        {ok ? (
          <React.Fragment>
            <p className="sub">Senha alterada com sucesso.</p>
            <div className="row" style={{ justifyContent: 'flex-end', marginTop: '16px' }}>
              <button onClick={props.onFechar}>Fechar</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '8px' }}>
              <div><label className="muted" style={{ fontSize: '12px' }}>Senha atual</label><input type="password" value={senhaAtual} onChange={function (e) { setSenhaAtual(e.target.value); }} /></div>
              <div><label className="muted" style={{ fontSize: '12px' }}>Nova senha</label><input type="password" value={senhaNova} onChange={function (e) { setSenhaNova(e.target.value); }} /></div>
              <div><label className="muted" style={{ fontSize: '12px' }}>Confirmar nova senha</label><input type="password" value={confirmarNova} onChange={function (e) { setConfirmarNova(e.target.value); }} /></div>
            </div>
            {erro ? <div className="err" style={{ marginTop: '10px' }}>{erro}</div> : null}
            <div className="row" style={{ justifyContent: 'flex-end', marginTop: '16px' }}>
              <button className="ghost" onClick={props.onFechar} disabled={enviando}>Cancelar</button>
              <button onClick={salvar} disabled={enviando || !senhaAtual || !senhaNova || !confirmarNova}>{enviando ? 'Salvando...' : 'Salvar'}</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// Reset administrativo de senha de OUTRO usuario -- so gerente (so da
// propria equipe, ja filtrado pela lista que o GET /usuarios devolve) ou
// diretor (qualquer um). Nao pede a senha atual.
function BotaoRedefinirSenha(props) {
  const [aberto, setAberto] = useState(false);
  const [senhaNova, setSenhaNova] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [msg, setMsg] = useState(null);

  function salvar() {
    if (senhaNova.length < 6) { setMsg('Mínimo 6 caracteres.'); return; }
    setEnviando(true);
    api('/usuarios/' + props.usuarioId + '/senha', { method: 'PUT', body: JSON.stringify({ senha_nova: senhaNova }) }, props.token)
      .then(function () { setMsg('Senha redefinida.'); setAberto(false); setSenhaNova(''); })
      .catch(function (e) { setMsg('Erro: ' + e.message); })
      .then(function () { setEnviando(false); });
  }

  if (!aberto) {
    return (
      <span>
        <button className="mini ghost" onClick={function () { setAberto(true); setMsg(null); }}>Redefinir senha</button>
        {msg ? <span className="muted" style={{ fontSize: '11px', marginLeft: '4px' }}>{msg}</span> : null}
      </span>
    );
  }
  return (
    <span className="row" style={{ flexWrap: 'nowrap' }}>
      <input type="password" placeholder="Nova senha (mín. 6)" value={senhaNova} onChange={function (e) { setSenhaNova(e.target.value); }} style={{ fontSize: '11px', maxWidth: '150px' }} />
      <button className="mini" disabled={enviando || senhaNova.length < 6} onClick={salvar}>{enviando ? '...' : 'Ok'}</button>
      <button className="mini ghost" onClick={function () { setAberto(false); setSenhaNova(''); }}>X</button>
    </span>
  );
}

function BotaoExcluirProjeto(props) {

// Icone de upload rapido na propria lista de projetos -- adiciona (ou, se o
// numero do pivo ja existir no projeto, atualiza como nova versao) uma
// planilha sem precisar abrir o projeto primeiro.
function BotaoUploadRapido(props) {
  const inputRef = React.useRef(null);
  const [status, setStatus] = useState(null);
  const [resultados, setResultados] = useState(null);
  const [enviando, setEnviando] = useState(false);

  async function aoSelecionarArquivos(ev) {
    const arquivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (arquivos.length === 0) return;
    setEnviando(true);
    setResultados(null);
    let pastaBase = null;
    if (SUPORTA_PASTA_LOCAL) {
      try { pastaBase = await obterPastaBase(); }
      catch (e) { setStatus('Pasta local não selecionada -- enviando só pra o sistema.'); }
    }
    const resultadosLote = [];
    for (const arquivo of arquivos) {
      setStatus('Lendo ' + arquivo.name + '...');
      let pivo = null;
      try {
        const buffer = await arquivo.arrayBuffer();
        const dado = extrairPivoDoArrayBuffer(buffer, arquivo.name);

        let caminhoLocal = null, revisao = 1;
        if (pastaBase) {
          const r = await organizarArquivoLocal(pastaBase, {
            cliente: props.projeto.cliente, estado: props.projeto.estado,
            municipio: props.projeto.municipio, fazenda: props.projeto.fazenda
          }, arquivo, arquivo.name);
          caminhoLocal = r.caminhoRelativo; revisao = r.revisao;
        }

        pivo = await api('/pivos', {
          method: 'POST', body: JSON.stringify(Object.assign({}, dado, {
            projeto_id: props.projeto.id, caminho_local: caminhoLocal, revisao: revisao
          }))
        }, props.token);

        // A partir daqui o pivô já existe no banco -- se o upload do arquivo
        // falhar agora, isso NÃO pode ficar invisível (era a causa do
        // "5 pivôs mas só 2 arquivos"): tratamos esse erro separadamente.
        try {
          const fd = new FormData();
          fd.append('arquivo', arquivo, arquivo.name);
          fd.append('projeto_id', props.projeto.id);
          fd.append('pivo_id', pivo.id);
          fd.append('tipo', 'pivo');
          await api('/arquivos', { method: 'POST', body: fd }, props.token);
          resultadosLote.push({ nome: arquivo.name, ok: true, msg: dado.numero_pivo + (pivo.nova_versao ? ' → v' + pivo.revisao + ' salva (planilha anexada).' : ' adicionado (planilha anexada).') });
        } catch (e2) {
          resultadosLote.push({ nome: arquivo.name, ok: false, msg: dado.numero_pivo + ' (v' + pivo.revisao + ') foi salvo no sistema, MAS o arquivo da planilha falhou ao anexar: ' + e2.message + '. Os dados do pivô estão ok; reenvie este arquivo para guardar a planilha original.' });
        }
      } catch (e) {
        resultadosLote.push({ nome: arquivo.name, ok: false, msg: 'Erro ao processar ' + arquivo.name + ': ' + e.message + '. Nada foi salvo para este arquivo.' });
      }
    }
    setEnviando(false);
    setStatus(null);
    setResultados(resultadosLote);
    props.onChange();
  }

  const temErro = resultados && resultados.some(function (r) { return !r.ok; });

  return (
    <span className="row" onClick={function (ev) { ev.stopPropagation(); }} style={{ flexWrap: 'nowrap', alignItems: 'flex-start' }}>
      <button
        className="mini ghost"
        title="Adicionar ou atualizar planilha de pivô deste projeto"
        disabled={enviando}
        onClick={function (ev) { ev.stopPropagation(); inputRef.current.click(); }}
      >
        {enviando ? '...' : '⬆️'}
      </button>
      <input ref={inputRef} type="file" accept=".xlsb" multiple style={{ display: 'none' }} onChange={aoSelecionarArquivos} />
      {status ? <span className="muted" style={{ fontSize: '11px', maxWidth: '150px' }}>{status}</span> : null}
      {resultados ? (
        <div style={{ fontSize: '11px', maxWidth: '280px', background: temErro ? '#3a1414' : 'transparent', border: temErro ? '1px solid #7a2b2b' : 'none', borderRadius: '6px', padding: temErro ? '6px 8px' : 0 }}>
          {resultados.map(function (r, i) {
            return <div key={i} style={{ color: r.ok ? '#8a8f98' : '#ff8a8a', marginBottom: '2px' }}>{r.ok ? '✓ ' : '⚠ '}{r.msg}</div>;
          })}
          <button className="mini ghost" style={{ marginTop: '4px' }} onClick={function (ev) { ev.stopPropagation(); setResultados(null); }}>Ok, entendi</button>
        </div>
      ) : null}
    </span>
  );
}

// Dashboard geral -- so analise agregada (KPIs + funil por status). A gestao
// de projetos (listar, abrir, criar, excluir) mora na tela "Projetos", em
// aba propria -- as duas coisas sao jobs diferentes e nao devem dividir tela.
function Dashboard(props) {
  const [kpis, setKpis] = useState(null);
  const [escopo, setEscopo] = useState('');
  const [porStatus, setPorStatus] = useState([]);
  const [erro, setErro] = useState(null);

  useEffect(function () {
    api('/dashboard', {}, props.token)
      .then(function (d) { setKpis(d.kpis); setEscopo(d.escopo); setPorStatus(d.por_status || []); })
      .catch(function (e) { setErro(e.message); });
  }, [props.token]);

  const ROTULO_STATUS = { negociando: 'Negociando', concluido_ganho: 'Ganhos', concluido_perdido: 'Perdidos' };
  const COR_STATUS = { negociando: '#eb0024', concluido_ganho: '#191b21', concluido_perdido: '#b9bcc2' };
  const maiorValor = Math.max(1, Math.max.apply(null, porStatus.map(function (s) { return s.valor; }).concat([0])));

  return (
    <div>
      {erro ? <div className="err">{erro}</div> : null}
      <h2 style={{ margin: '0 0 12px' }}>Dashboard geral &middot; <span className="muted" style={{ fontWeight: 400, fontSize: '13px' }}>{escopo || 'todas as negociações no seu escopo'}</span></h2>
      <div className="kpis">
        <div className="kpi"><span>Total de projetos</span><strong>{kpis ? kpis.total : '-'}</strong></div>
        <div className="kpi"><span>Negociando</span><strong>{kpis ? kpis.negociando : '-'}</strong></div>
        <div className="kpi"><span>Ganhos</span><strong>{kpis ? kpis.concluidos_ganho : '-'}</strong></div>
        <div className="kpi"><span>Perdidos</span><strong>{kpis ? kpis.concluidos_perdido : '-'}</strong></div>
        <div className="kpi"><span>Pivôs</span><strong>{kpis ? kpis.qtde_pivos : '-'}</strong></div>
        <div className="kpi"><span>Área total</span><strong>{kpis ? numero(kpis.area_total_ha, 1) + ' ha' : '-'}</strong></div>
        <div className="kpi"><span>Valor total</span><strong>{kpis ? brl(kpis.valor_total) : '-'}</strong></div>
        <div className="kpi"><span>Custo/ha médio</span><strong>{kpis ? brl(kpis.custo_por_hectare_medio) : '-'}</strong></div>
      </div>

      <div className="panel">
        <h2 style={{ marginBottom: '4px' }}>Funil por status</h2>
        <p className="muted" style={{ margin: '0 0 16px' }}>Quantos projetos, quanto de valor negociado e quanta área estão em cada etapa.</p>
        {porStatus.map(function (s) {
          const pct = Math.max(2, Math.round((s.valor / maiorValor) * 100));
          return (
            <div key={s.status} style={{ marginBottom: '16px' }}>
              <div className="row" style={{ justifyContent: 'space-between', marginBottom: '6px' }}>
                <span style={{ fontWeight: 600 }}>{ROTULO_STATUS[s.status] || s.status}</span>
                <span className="muted" style={{ fontSize: '13px' }}>
                  {s.qtde} projeto{s.qtde === 1 ? '' : 's'} &middot; {numero(s.area_ha, 1)} ha &middot; <strong style={{ color: 'var(--preto)' }}>{brl(s.valor)}</strong>
                </span>
              </div>
              <div style={{ background: 'var(--cinza)', borderRadius: '6px', height: '10px', overflow: 'hidden' }}>
                <div style={{ width: pct + '%', height: '100%', borderRadius: '6px', background: COR_STATUS[s.status] || 'var(--texto-sutil)' }} />
              </div>
            </div>
          );
        })}
        {porStatus.length === 0 ? <p className="muted">Nenhum projeto no seu escopo ainda.</p> : null}
      </div>
    </div>
  );
}

// Tela de gestao de projetos -- listar, criar, abrir, excluir. Separada do
// Dashboard geral (que e so analise/KPI), a pedido explicito: cada tela faz
// um job.
function Projetos(props) {
  const [projetos, setProjetos] = useState([]);

  const [busca, setBusca] = useState('');

  const carregar = useCallback(function () {
    api('/projetos', {}, props.token).then(setProjetos).catch(function (e) { setErro(e.message); });
    api('/dashboard', {}, props.token).then(function (d) { setEscopo(d.escopo); }).catch(function () {});
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  const termo = busca.trim().toLowerCase();
  const filtrados = termo
    ? projetos.filter(function (p) {
        return (p.cliente || '').toLowerCase().indexOf(termo) >= 0
          || (p.municipio || '').toLowerCase().indexOf(termo) >= 0
          || (p.vendedor_nome || '').toLowerCase().indexOf(termo) >= 0;
      })
    : projetos;

  return (
    <div>

      <div className="row" style={{ justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' }}>
        <h2 style={{ margin: 0 }}>Projetos &middot; <span className="muted" style={{ fontWeight: 400, fontSize: '13px' }}>escopo: {escopo || '-'}</span></h2>
        <NovoProjeto token={props.token} onChange={carregar} onAbrir={props.onAbrirProjeto} />
      </div>

      <div className="panel">
        <input
          type="text"
          placeholder="Buscar por cliente, município ou vendedor..."
          value={busca}
          onChange={function (ev) { setBusca(ev.target.value); }}
          style={{ marginBottom: '14px', maxWidth: '360px' }}
        />
        <div style={{ overflowX: 'auto' }}>
        <table>
          <thead>
            <tr><th>Cliente</th><th>Local</th><th>Vendedor</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody>
            {filtrados.map(function (p) {
              return (
                <tr key={p.id} className="clicavel" onClick={function () { props.onAbrirProjeto(p.id); }}>
                  <td style={{ fontWeight: 600 }}>{p.cliente}</td>
                  <td>{p.municipio ? p.municipio + '/' : ''}{p.estado || '-'}</td>
                  <td>{p.vendedor_nome || '-'}</td>
                  <td><span className={'tag ' + p.status}>{formatarStatus(p.status)}</span></td>
                  <td>
                    <div className="row" style={{ flexWrap: 'nowrap' }}>
                      <button className="mini ghost" title="Abrir análise comercial deste projeto" onClick={function (ev) { ev.stopPropagation(); props.onAbrirProjeto(p.id); }}>
                        Abrir
                      </button>
                      <BotaoUploadRapido projeto={p} token={props.token} onChange={carregar} />
                      {props.usuario.nivel === 'diretor' ? <BotaoExcluirProjeto projetoId={p.id} nomeCliente={p.cliente} token={props.token} onExcluido={carregar} /> : null}
                    </div>
                  </td>
                </tr>
              );
            })}
            {projetos.length === 0 ? <tr><td colSpan={5} className="muted">Nenhum projeto no seu escopo.</td></tr> : null}
            {projetos.length > 0 && filtrados.length === 0 ? <tr><td colSpan={5} className="muted">Nenhum projeto encontrado para "{busca}".</td></tr> : null}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function Pendentes(props) {
  const [lista, setLista] = useState([]);
  const [erro, setErro] = useState(null);
  const [status, setStatus] = useState(null);

  const carregar = useCallback(function () {
    api('/arquivos/pendentes', {}, props.token).then(setLista).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  // Aceitar/recusar e a decisao comercial que importa -- NUNCA pode ficar
  // refem de salvar uma copia local (pasta cancelada, disco cheio, etc).
  // Por isso agora sao duas acoes independentes: aceitar() so decide; a
  // tentativa de organizar a copia local acontece depois, best-effort, e um
  // erro nela nao desfaz o aceite nem impede ver o aviso de sucesso.
  async function aceitar(a) {
    setStatus('Aceitando ' + a.nome + '...');
    try {
      await api('/arquivos/' + a.id + '/aceitar', { method: 'PUT' }, props.token);
    } catch (e) {
      setStatus('Erro ao aceitar: ' + e.message);
      return;
    }
    setStatus(a.nome + ' aceito.');
    carregar();
    if (props.onMudouContagem) props.onMudouContagem();

    if (SUPORTA_PASTA_LOCAL) {
      try {
        const pastaBase = await obterPastaBase();
        const link = await api('/arquivos/' + a.id + '/link', {}, props.token);
        const resp = await fetch(link.url);
        const blob = await resp.blob();
        const proj = a.projetos || {};
        await organizarArquivoLocal(pastaBase, proj, blob, a.nome);
        setStatus(a.nome + ' aceito e organizado na sua pasta local.');
      } catch (e) {
        setStatus(a.nome + ' foi aceito normalmente, mas não deu pra salvar a cópia na pasta local: ' + e.message + '. Use "Baixar" na aba Arquivos do projeto se precisar do arquivo.');
      }
    }
  }
  function recusar(a) {
    if (!confirm('Recusar ' + a.nome + '?')) return;
    api('/arquivos/' + a.id + '/recusar', { method: 'PUT' }, props.token).then(function () { carregar(); if (props.onMudouContagem) props.onMudouContagem(); }).catch(function (e) { setErro(e.message); });
  }

  return (
    <div className="panel">
      <h2>Arquivos pendentes de aceite ({lista.length})</h2>
      {erro ? <div className="err">{erro}</div> : null}
      {status ? <p className="muted">{status}</p> : null}
      {!SUPORTA_PASTA_LOCAL ? <p className="muted">Este navegador não organiza a pasta local automaticamente (use Chrome/Edge) -- aceitar ainda marca o arquivo como aprovado.</p> : null}
      <table>
        <thead><tr><th>Arquivo</th><th>Projeto</th><th>Enviado em</th><th>Ações</th></tr></thead>
        <tbody>
          {lista.map(function (a) {
            const proj = a.projetos || {};
            return (
              <tr key={a.id}>
                <td>{a.nome}</td>
                <td>{proj.cliente || '-'}</td>
                <td className="muted">{new Date(a.created_at).toLocaleString('pt-BR')}</td>
                <td>
                  <div className="row">
                    <button className="mini" onClick={function () { aceitar(a); }}>Aceitar</button>
                    <button className="mini perigo" onClick={function () { recusar(a); }}>Recusar</button>
                  </div>
                </td>
              </tr>
            );
          })}
          {lista.length === 0 ? <tr><td colSpan={4} className="muted">Nada pendente.</td></tr> : null}
        </tbody>
      </table>
    </div>
  );
}

function AdminConfigFiscal(props) {
  const [estados, setEstados] = useState([]);
  const [globais, setGlobais] = useState([]);
  const [erro, setErro] = useState(null);
  const [msg, setMsg] = useState(null);

  const carregar = useCallback(function () {
    api('/config/fiscal', {}, props.token).then(function (d) { setEstados(d.estados); setGlobais(d.globais); }).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  function salvarEstado(estado, valor) {
    api('/config/fiscal/' + estado, { method: 'PUT', body: JSON.stringify({ icms_pct: Number(valor) }) }, props.token)
      .then(function () { setMsg(estado + ' atualizado.'); carregar(); })
      .catch(function (e) { setErro(e.message); });
  }
  function salvarGlobal(chave, valor) {
    api('/config/global/' + chave, { method: 'PUT', body: JSON.stringify({ valor: Number(valor) }) }, props.token)
      .then(function () { setMsg(chave + ' atualizado.'); carregar(); })
      .catch(function (e) { setErro(e.message); });
  }

  return (
    <div>
      <div className="panel">
        <h2>Constantes da fórmula de precificação</h2>
        <p className="muted" style={{ marginTop: '-6px', marginBottom: '10px' }}>
          Usadas no cálculo do Valor Negociado de todo pivô, junto com o ICMS do estado (abaixo). Mude só se a alíquota ou a política de revenda mudar de verdade.
        </p>
        {erro ? <div className="err">{erro}</div> : null}
        {msg ? <div className="ok">{msg}</div> : null}
        <table>
          <thead><tr><th>Parâmetro</th><th>Descrição</th><th>Valor</th></tr></thead>
          <tbody>
            {globais.map(function (g) {
              return (
                <tr key={g.chave}>
                  <td>{ROTULOS_CONFIG_GLOBAL[g.chave] || g.chave}</td>
                  <td className="muted">{g.descricao}</td>
                  <td>
                    <div className="row">
                      <input className="campo-mini" type="number" step="0.01" defaultValue={g.valor} id={'glob-' + g.chave} />
                      <button className="mini ghost" onClick={function () { salvarGlobal(g.chave, document.getElementById('glob-' + g.chave).value); }}>Salvar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="panel">
        <h2>Alíquota de ICMS por estado</h2>
        <p className="muted" style={{ marginTop: '-6px', marginBottom: '10px' }}>
          Entra na mesma fórmula do Valor Negociado -- cada estado tem a sua.
        </p>
        <table>
          <thead><tr><th>Estado</th><th>ICMS %</th></tr></thead>
          <tbody>
            {estados.map(function (e) {
              return (
                <tr key={e.estado}>
                  <td>{e.estado}</td>
                  <td>
                    <div className="row">
                      <input className="campo-mini" type="number" step="0.1" defaultValue={e.icms_pct} id={'icms-' + e.estado} />
                      <button className="mini ghost" onClick={function () { salvarEstado(e.estado, document.getElementById('icms-' + e.estado).value); }}>Salvar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Admin(props) {
  return (
    <div>
      <AdminUsuarios token={props.token} />
      <AdminConfigFiscal token={props.token} />
    </div>
  );
}

// Icones de linha (18px, stroke atual) -- um unico sistema visual na barra
// lateral em vez de emoji (que varia de fonte pra fonte entre SO/navegador
// e nao combina com o resto da interface).
function Icone(props) {
  const corpos = {
    casa: <path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1V9.5Z" />,
    bandeja: <path d="M3 11h3.2a1 1 0 0 1 .9.56L8 13.5h4l.9-1.94a1 1 0 0 1 .9-.56H17M4 11l1.2-5.2A1 1 0 0 1 6.17 5h7.66a1 1 0 0 1 .97.76L17 11M4 11v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4" />,
    engrenagem: <path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Zm7-2.6c0 .4 0 .8-.1 1.2l1.5 1.1-1.3 2.3-1.8-.6a5.9 5.9 0 0 1-2 1.2l-.3 1.9H10.3l-.3-1.9a5.9 5.9 0 0 1-2-1.2l-1.8.6-1.3-2.3L6.4 9.8C6.3 9.4 6.3 9 6.3 8.6s0-.8.1-1.2L4.9 6.3l1.3-2.3 1.8.6a5.9 5.9 0 0 1 2-1.2l.3-1.9h2.4l.3 1.9c.7.26 1.4.68 2 1.2l1.8-.6 1.3 2.3-1.5 1.1c.1.4.1.8.1 1.2Z" />,
    grafico: <path d="M4 16V4M4 16h13M7 13V9m3.3 4V6m3.4 7v-2.5" />,
    sair: <path d="M8 4H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M12 13.5 16 10l-4-3.5M16 10H7" />,
    maisPequeno: <path d="M9 3.5v11M3.5 9h11" />,
    // Visao geral do projeto -- a mesma barra/coluna do icone "grafico", reaproveitado.
    parametros: (
      <React.Fragment>
        <path d="M3 6h5M12 6h5M3 10h9M16 10h1M3 14h3M10 14h7" />
        <circle cx="10" cy="6" r="1.5" />
        <circle cx="14" cy="10" r="1.5" />
        <circle cx="8" cy="14" r="1.5" />
      </React.Fragment>
    ),
    // Vista aerea de um pivo central (circulo + braco) -- icone proprio do
    // dominio em vez de um glifo generico, pra representar a secao "Pivos".
    pivo: (
      <React.Fragment>
        <circle cx="10" cy="10" r="6.3" />
        <circle cx="10" cy="10" r="2.3" />
        <path d="M10 3.7V2.1M10 10l5.2-3" />
      </React.Fragment>
    ),
    caixa: (
      <React.Fragment>
        <path d="M3 7.2 10 4l7 3.2v7.2L10 17l-7-2.6V7.2Z" />
        <path d="M3 7.2 10 10l7-2.8M10 10v7" />
      </React.Fragment>
    ),
    documento: (
      <React.Fragment>
        <path d="M6 2.5h6l3 3V17a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z" />
        <path d="M12 2.5V6h3M7.3 10.2h5.4M7.3 13.2h5.4" />
      </React.Fragment>
    ),
    pasta: <path d="M3 6a1 1 0 0 1 1-1h3.8l1.6 1.6H16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z" />,
  };
  return (
    <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      {corpos[props.nome] || null}
    </svg>
  );
}

function App() {
  const [token, setToken] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [tela, setTela] = useState('dashboard');
  const [qtdePendentes, setQtdePendentes] = useState(0);
  const [projetoAberto, setProjetoAberto] = useState(null);
  const [projetoAtual, setProjetoAtual] = useState(null);
  const [dashboardKey, setDashboardKey] = useState(0);
  const [secaoProjeto, setSecaoProjeto] = useState('visao-geral');
  const [mostrarTrocarSenha, setMostrarTrocarSenha] = useState(false);

  function abrirProjeto(id) {
    setProjetoAtual(null);
    setProjetoAberto(id);
    setSecaoProjeto('visao-geral');
  }
  function fecharProjeto() {
    setProjetoAberto(null);
    setProjetoAtual(null);
    setDashboardKey(function (k) { return k + 1; });
  }

  useEffect(function () {
    const t = localStorage.getItem('pivot_token');
    const u = localStorage.getItem('pivot_usuario');
    if (t && u) { setToken(t); setUsuario(JSON.parse(u)); }
  }, []);

  const atualizarContagemPendentes = useCallback(function () {
    if (!token) return;
    api('/arquivos/pendentes', {}, token).then(function (d) { setQtdePendentes(d.length); }).catch(function () {});
  }, [token]);

  useEffect(function () { atualizarContagemPendentes(); }, [atualizarContagemPendentes]);

  function onLogin(t, u) {
    localStorage.setItem('pivot_token', t);
    localStorage.setItem('pivot_usuario', JSON.stringify(u));
    setToken(t); setUsuario(u);
  }
  function onLogout() {
    if (token) api('/logout', { method: 'POST' }, token).catch(function () {});
    localStorage.removeItem('pivot_token');
    localStorage.removeItem('pivot_usuario');
    setToken(null); setUsuario(null);
  }

  if (!token || !usuario) return <Login onLogin={onLogin} />;

  const podeAdmin = usuario.nivel === 'gerente' || usuario.nivel === 'diretor';
  const podeReceberArquivo = usuario.nivel === 'gerente' || usuario.nivel === 'diretor';

  function irPara(novaTela) {
    setProjetoAberto(null);
    setTela(novaTela);
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="marca">
          <div className="marca-selo">P</div>
          <div>
            <div className="brand">PIVOT Deal Manager</div>
            <div className="brand-sub">GESTÃO DE PROPOSTAS</div>
          </div>
        </div>

        <nav className="secao">
          <p className="titulo">Acompanhar</p>
          <button className={(tela === 'dashboard' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('dashboard'); }}>
            <Icone nome="grafico" /> Dashboard geral
          </button>
          <button className={(tela === 'projetos' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('projetos'); }}>
            <Icone nome="caixa" /> Projetos
          </button>
          {podeReceberArquivo ? (
            <button className={(tela === 'pendentes' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('pendentes'); }}>
              <Icone nome="bandeja" /> Pendentes
              {qtdePendentes > 0 ? <span className="badge-inline">{qtdePendentes}</span> : null}
            </button>
          ) : null}
        </nav>

        {podeAdmin ? (
          <nav className="secao">
            <p className="titulo">Organizar</p>
            <button className={(tela === 'admin' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('admin'); }}>
              <Icone nome="engrenagem" /> Usuários &amp; fiscal
            </button>
          </nav>
        ) : null}

        <nav className="secao">
          <p className="titulo">Negociação</p>
          <div className={'negociacao-nome' + (projetoAberto ? '' : ' vazia')}>
            {projetoAberto ? (projetoAtual ? projetoAtual.cliente : 'Carregando...') : 'Nenhuma negociação aberta'}
          </div>
          {SECOES_PROJETO.map(function (s) {
            return (
              <button
                key={s.id}
                className={projetoAberto && secaoProjeto === s.id ? 'ativo' : ''}
                disabled={!projetoAberto}
                onClick={function () { setSecaoProjeto(s.id); }}
              >
                <Icone nome={s.icone} /> {s.rotulo}
              </button>
            );
          })}
        </nav>

        <div className="perfil">
          <div className="avatar">{iniciais(usuario.nome)}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="nome">{usuario.nome}</div>
            <div className="nivel">{usuario.nivel}</div>
          </div>
          <div className="row" style={{ flexWrap: 'nowrap', gap: '4px' }}>
            <button className="mini ghost" title="Trocar minha senha" onClick={function () { setMostrarTrocarSenha(true); }}>🔑</button>
            <button className="mini ghost" onClick={onLogout} style={{ display: 'flex', alignItems: 'center', gap: '5px' }}><Icone nome="sair" />Sair</button>
          </div>
        </div>
        <div className="muted" style={{ fontSize: '10px', textAlign: 'center', padding: '6px 0 2px', opacity: .5 }}>v{VERSAO_APP}</div>
      </aside>

      {mostrarTrocarSenha ? <ModalTrocarSenha token={token} onFechar={function () { setMostrarTrocarSenha(false); }} /> : null}

      <div className="conteudo">
        <main>
          {projetoAberto ? (
            <ProjetoDetalhe
              projetoId={projetoAberto}
              token={token}
              usuario={usuario}
              secao={secaoProjeto}
              onVoltar={fecharProjeto}
              onCarregado={setProjetoAtual}
            />
          ) : (
            <React.Fragment>
              {tela === 'admin' && podeAdmin ? <Admin token={token} /> : null}
              {tela === 'pendentes' && podeReceberArquivo ? <Pendentes token={token} onMudouContagem={atualizarContagemPendentes} /> : null}
              {tela === 'dashboard' ? <Dashboard key={dashboardKey} token={token} /> : null}
              {tela === 'projetos' ? <Projetos key={dashboardKey} token={token} usuario={usuario} onAbrirProjeto={abrirProjeto} /> : null}
            </React.Fragment>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
