<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Sem isso, o Safari/iOS "detecta" endereco (ex. "FAZENDA X -- CIDADE/UF")
     e numero de telefone como link e pinta de azul sublinhado por conta
     propria, por fora de qualquer CSS nosso -- e exatamente o que deixava o
     cabecalho do projeto com aquele texto azul feio no celular. -->
<meta name="format-detection" content="telephone=no, address=no, email=no" />
<title>PIVOT Deal Manager WEB</title>
<style>
  /* Paleta extraida do site institucional pivot.com.br (preto/cinza neutro + vermelho de
     acao -- a Pivot nao usa azul em lugar nenhum, entao todo tom frio/azulado foi
     trocado por cinza neutro). */
  :root {
    --preto:#191b21; --vermelho:#eb0024; --cinza:#f3f3f3; --borda:#e3e3e3; --vermelho-claro:#fdeaea; --texto-sutil:#6b6f73;
    /* Barra lateral escura -- usa o mesmo preto/vermelho da identidade da Pivot
       (ver comentario acima), em vez de branco-sobre-branco com o conteudo. Da
       uma coluna de controle fixa e com presenca visual propria. */
    --sidebar-bg:#15171b; --sidebar-bg-fundo:#101114; --sidebar-texto:#aeb2ba; --sidebar-texto-forte:#ffffff;
    --sidebar-hover:rgba(255,255,255,.055); --sidebar-ativo:rgba(235,0,36,.16); --sidebar-borda:rgba(255,255,255,.09);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--cinza); color:#212529; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:14px; padding:28px; width:100%; max-width:380px; box-shadow:0 8px 24px rgba(25,27,33,.08); }
  .card h1 { margin:0 0 4px; font-size:20px; }
  .card p.sub { margin:0 0 20px; font-size:12px; color:var(--texto-sutil); }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; height:42px; border:1px solid var(--borda); border-radius:9px; padding:0 12px; font-size:14px; background:#fafafa; }
  button { height:42px; border:0; border-radius:9px; background:var(--vermelho); color:#fff; font-weight:600; font-size:14px; cursor:pointer; padding:0 16px; }
  button.ghost { background:#fff; color:var(--vermelho); border:1px solid var(--vermelho); }
  button.mini { height:30px; font-size:12px; padding:0 10px; }
  button.perigo { background:#fff; color:#9f1239; border:1px solid #fecdd3; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .err { background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; padding:10px; border-radius:9px; font-size:12px; margin-top:14px; }
  .ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; padding:10px; border-radius:9px; font-size:12px; margin-top:14px; }
  .badge { position:absolute; top:-6px; right:-6px; background:#c0392b; color:#fff; font-size:10px; border-radius:999px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  main { padding:22px; max-width:1200px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:14px; }
  .kpi span { display:block; font-size:11px; text-transform:uppercase; color:var(--texto-sutil); letter-spacing:.03em; }
  .kpi strong { font-size:22px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--borda); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid #ececec; }
  th { background:#f6f6f6; font-size:11px; text-transform:uppercase; color:var(--texto-sutil); }
  tr.clicavel { cursor:pointer; }
  tr.clicavel:hover { background:#f6f6f6; }
  .tag { font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; }
  .tag.negociando { background:#fff5e0; color:#8c520a; }
  .tag.concluido_ganho, .tag.aceito { background:#ecfdf5; color:#065f46; }
  .tag.concluido_perdido, .tag.recusado { background:#fff1f2; color:#9f1239; }
  .tag.pendente { background:#ececed; color:#32323a; }
  .panel { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:15px; }
  .muted { font-size:12px; color:var(--texto-sutil); }
  .campo-mini { width:76px; height:30px; padding:0 8px; text-align:right; }
  .campo-mini.campo-percentual { width:88px; }
  .campo-mini.campo-monetario { width:140px; }
  .voltar { background:none; color:var(--vermelho); height:auto; padding:0; font-size:13px; font-weight:600; margin-bottom:12px; }
  .grid-campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; margin:8px 0; }
  .grid-campos label { margin:0 0 2px; font-size:10px; }
  .app-shell { display:flex; min-height:100vh; align-items:stretch; }
  .sidebar {
    width:264px; flex-shrink:0; background:var(--sidebar-bg); padding:18px 14px 16px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar .marca { display:flex; align-items:center; gap:10px; padding:4px 6px 0; margin-bottom:18px; }
  .sidebar .marca-selo { width:30px; height:30px; border-radius:8px; background:var(--vermelho); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
  .sidebar .brand { font-weight:700; font-size:14.5px; color:var(--sidebar-texto-forte); letter-spacing:-.01em; line-height:1.25; }
  .sidebar .brand-sub { font-size:10.5px; color:var(--sidebar-texto); letter-spacing:.03em; }

  .sidebar .pipeline { display:flex; gap:0; margin:4px 6px 20px; border:1px solid var(--sidebar-borda); border-radius:10px; overflow:hidden; }
  .sidebar .pipeline .celula { flex:1; padding:9px 4px; text-align:center; border-left:1px solid var(--sidebar-borda); }
  .sidebar .pipeline .celula:first-child { border-left:0; }
  .sidebar .pipeline strong { display:block; font-size:16px; color:var(--sidebar-texto-forte); line-height:1.1; }
  .sidebar .pipeline span { display:block; font-size:9.5px; color:var(--sidebar-texto); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .sidebar .pipeline .celula.ganho strong { color:#5fd999; }
  .sidebar .pipeline .celula.perdido strong { color:#ef8686; }

  .sidebar nav.secao { margin-bottom:6px; }
  .sidebar nav.secao .titulo { font-size:10px; color:var(--sidebar-texto); text-transform:uppercase; letter-spacing:.07em; margin:14px 0 6px 10px; opacity:.75; }
  .sidebar .negociacao-nome { font-size:12px; font-weight:700; color:var(--sidebar-texto-forte); padding:0 10px; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sidebar .negociacao-nome.vazia { font-weight:500; font-style:italic; color:var(--sidebar-texto); opacity:.75; }
  .sidebar nav.secao button {
    width:100%; text-align:left; background:none; border:0; color:var(--sidebar-texto); height:38px; padding:0 10px;
    border-radius:8px; font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:10px; cursor:pointer;
    margin-bottom:1px; transition:background .12s ease, color .12s ease;
  }
  .sidebar nav.secao button svg { flex-shrink:0; opacity:.85; }
  .sidebar nav.secao button:hover { background:var(--sidebar-hover); color:var(--sidebar-texto-forte); }
  .sidebar nav.secao button:disabled { opacity:.3; cursor:default; }
  .sidebar nav.secao button:disabled:hover { background:none; color:var(--sidebar-texto); }
  .sidebar nav.secao button.ativo { background:var(--sidebar-ativo); color:var(--sidebar-texto-forte); font-weight:700; position:relative; }
  .sidebar nav.secao button.ativo svg { opacity:1; color:#ff5a72; }
  .sidebar nav.secao button.ativo::before { content:''; position:absolute; left:-14px; top:6px; bottom:6px; width:3px; border-radius:3px; background:var(--vermelho); }
  .sidebar .badge-inline { background:var(--vermelho); color:#fff; font-size:10px; border-radius:999px; min-width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; margin-left:auto; }

  .sidebar .perfil { margin-top:auto; display:flex; align-items:center; gap:10px; padding:14px 6px 2px; border-top:1px solid var(--sidebar-borda); }
  .sidebar .avatar { width:32px; height:32px; border-radius:999px; background:#2a2d33; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0; }
  .sidebar .perfil .nome { font-weight:600; font-size:12.5px; color:var(--sidebar-texto-forte); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sidebar .perfil .nivel { font-size:11px; color:var(--sidebar-texto); text-transform:capitalize; }
  .sidebar .perfil button.mini.ghost { background:none; border:1px solid var(--sidebar-borda); color:var(--sidebar-texto); }
  .sidebar .perfil button.mini.ghost:hover { border-color:var(--vermelho); color:#ff5a72; }

  .novo-projeto-btn { width:100%; background:var(--vermelho); color:#fff; font-weight:700; border-radius:9px; height:42px; border:0; cursor:pointer; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:7px; margin:2px 0 20px; }
  .novo-projeto-btn:disabled { opacity:.6; cursor:not-allowed; }
  .conteudo { flex:1; min-width:0; }
  @media print {
    body * { visibility: hidden; }
    #resumo-comercial-imprimir, #resumo-comercial-imprimir * { visibility: visible; }
    #resumo-comercial-imprimir { position: absolute; left: 0; top: 0; width: 100%; }
    .no-imprimir { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = '';
// Marcador de versao -- SPA so busca codigo novo numa recarga de pagina de
// verdade (F5/Ctrl+Shift+R), nunca so navegando dentro do app. Isso aqui e
// o jeito de confirmar se uma tela esta mesmo na ultima versao publicada
// antes de reportar algo como bug -- bump a cada deploy.
const VERSAO_APP = '2026-10-18.7';

function api(path, options, token) {
  const opts = options || {};
  const headers = Object.assign({}, opts.headers || {});
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, Object.assign({}, opts, { headers: headers })).then(function (r) {
    return r.text().then(function (t) {
      let data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = { erro: t }; }
      if (!r.ok) throw new Error((data && data.erro) || ('Falha HTTP ' + r.status));
      return data;
    });
  });
}
const ROTULOS_STATUS = { negociando: 'Negociando', concluido_ganho: 'Concluído como Ganho', concluido_perdido: 'Concluído como Perdido', aceito: 'Aceito', recusado: 'Recusado', pendente: 'Pendente' };

// Secoes da negociacao aberta, navegaveis pela barra lateral -- em vez de
// empilhar tudo (parametros + itens + resumo tecnico + proposta + pivos +
// arquivos) numa unica pagina longa, cada conceito vira sua propria tela.
const SECOES_PROJETO = [
  { id: 'visao-geral', rotulo: 'Visão geral', icone: 'grafico' },
  { id: 'parametros', rotulo: 'Parâmetros comerciais', icone: 'parametros' },
  { id: 'pivos', rotulo: 'Pivôs', icone: 'pivo' },
  { id: 'itens', rotulo: 'Itens adicionais', icone: 'caixa' },
  { id: 'proposta', rotulo: 'Proposta', icone: 'documento' },
  { id: 'arquivos', rotulo: 'Arquivos', icone: 'pasta' },
];
function formatarStatus(status) { return ROTULOS_STATUS[status] || status; }

const ROTULOS_TIPO_ITEM = { bombeamento: 'Bombeamento', pvc: 'PVC', cabos_eletricos: 'Cabos Elétricos', outro: 'Outro' };
const ROTULOS_MOTIVO_PERDA = {
  valor: 'Valor', concorrencia: 'Concorrência', prazo_entrega: 'Prazo de entrega',
  relacionamento: 'Relacionamento/confiança', cancelado_cliente: 'Projeto cancelado pelo cliente', outro: 'Outro'
};
const CONCORRENTES = ['Valley', 'Bauer', 'Krebsfer', 'Focking'];
const ROTULOS_CONFIG_GLOBAL = { desconto_revenda_pct: 'Desconto de revenda', pis_pct: 'PIS' };
function iniciais(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  const a = partes[0] ? partes[0][0] : '';
  const b = partes.length > 1 ? partes[partes.length - 1][0] : '';
  return (a + b).toUpperCase();
}
function brl(v) {
  return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function numero(v, casas) {
  return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0 });
}

// Campos numericos formatados (% com separador de milhar e 2 casas decimais,
// R$ no padrao brasileiro) -- o valor fica formatado DENTRO do proprio campo
// (ex: "10,00%", "R$ 1.234,56"), nao como texto solto do lado de fora. Ao
// focar, troca para edicao em texto puro (selecionado inteiro, so digitar
// por cima); ao sair do campo, reformata e confirma (onCommit).
function CampoFormatado(props) {
  const [editando, setEditando] = useState(false);
  const [texto, setTexto] = useState('');

  function iniciarEdicao(ev) {
    setTexto(numero(props.value, 2));
    setEditando(true);
    const alvo = ev.target;
    setTimeout(function () { alvo.select(); }, 0);
  }
  function commitar() {
    const limpo = texto.replace(/\./g, '').replace(',', '.').trim();
    const n = parseFloat(limpo);
    setEditando(false);
    if (!isNaN(n)) props.onCommit(n);
  }

  const formatado = props.prefixo ? props.prefixo + numero(props.value, 2) : numero(props.value, 2) + (props.sufixo || '');

  return (
    <input
      className={'campo-mini ' + (props.classe || '')} type="text" inputMode="decimal" disabled={props.disabled}
      value={editando ? texto : formatado}
      onFocus={iniciarEdicao}
      onChange={function (e) { setTexto(e.target.value); }}
      onBlur={commitar}
      onKeyDown={function (e) { if (e.key === 'Enter') e.target.blur(); }}
    />
  );
}
function CampoPercentual(props) { return <CampoFormatado {...props} sufixo="%" classe="campo-percentual" />; }
function CampoMonetario(props) { return <CampoFormatado {...props} prefixo="R$ " classe="campo-monetario" />; }

// ============================================================================
// Organizacao local de arquivos (File System Access API -- Chrome/Edge).
// A pasta raiz e escolhida uma vez pelo usuario e lembrada no IndexedDB deste
// navegador/computador. Cada arquivo e organizado em Cliente/Estado/
// Municipio/Fazenda/, com versionamento (v2, v3... todas na mesma pasta).
// ============================================================================
const SUPORTA_PASTA_LOCAL = typeof window.showDirectoryPicker === 'function';

function idbAbrir() {
  return new Promise(function (resolve, reject) {
    const req = indexedDB.open('pivot-local', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('handles'); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbGet(chave) {
  return idbAbrir().then(function (db) {
    return new Promise(function (resolve, reject) {
      const tx = db.transaction('handles', 'readonly').objectStore('handles').get(chave);
      tx.onsuccess = function () { resolve(tx.result); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}
function idbSet(chave, valor) {
  return idbAbrir().then(function (db) {
    return new Promise(function (resolve, reject) {
      const tx = db.transaction('handles', 'readwrite').objectStore('handles').put(valor, chave);
      tx.onsuccess = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}

// Importante (e e exatamente o que gera a pergunta "mas o sistema nao
// perguntou onde salvar"): a pasta so e perguntada (showDirectoryPicker) na
// PRIMEIRA vez que o navegador precisa dela. Depois disso o handle da pasta
// fica guardado no IndexedDB deste navegador/perfil (pivot-local), e se a
// permissao ainda estiver valida ele e reusado silenciosamente -- sem abrir
// dialogo nenhum -- em todo upload seguinte. Isso e o esperado (senao o
// usuario teria que escolher a pasta toda vez), mas sem nenhum indicador na
// tela disso fica parecendo magica. Por seguranca do proprio navegador, a
// API nunca revela o caminho absoluto (tipo C:\Users\...) -- so o nome da
// pasta escolhida (handle.name). Ver <PastaLocalStatus> abaixo, que mostra
// esse nome e deixa trocar a pasta.
async function obterPastaBase(forcarEscolha) {
  if (!SUPORTA_PASTA_LOCAL) return null;
  if (!forcarEscolha) {
    let handle = await idbGet('pasta_base').catch(function () { return null; });
    if (handle) {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') return handle;
      const pedido = await handle.requestPermission({ mode: 'readwrite' });
      if (pedido === 'granted') return handle;
    }
  }
  const handleNovo = await window.showDirectoryPicker({ mode: 'readwrite' });
  await idbSet('pasta_base', handleNovo);
  return handleNovo;
}

async function limparPastaBase() {
  await idbSet('pasta_base', null);
}

// Mostra qual pasta local esta vinculada neste navegador (so o nome --
// o navegador nunca expoe o caminho completo), e deixa escolher outra.
// Sem isso, nao tinha como o usuario saber se/onde estava salvando.
function PastaLocalStatus() {
  const [handle, setHandle] = useState(undefined); // undefined = carregando, null = nenhuma
  const [trocando, setTrocando] = useState(false);
  const [erro, setErro] = useState(null);

  function carregar() {
    if (!SUPORTA_PASTA_LOCAL) { setHandle(null); return; }
    idbGet('pasta_base').then(function (h) { setHandle(h || null); }).catch(function () { setHandle(null); });
  }
  useEffect(carregar, []);

  async function trocarPasta() {
    setErro(null); setTrocando(true);
    try {
      const h = await obterPastaBase(true);
      setHandle(h);
    } catch (e) {
      setErro('Escolha cancelada ou negada: ' + e.message);
    }
    setTrocando(false);
  }

  if (!SUPORTA_PASTA_LOCAL) {
    return <p className="muted" style={{ fontSize: '12px' }}>Organização em pasta local: não suportada neste navegador (use Chrome/Edge no computador). Os arquivos ficam só na nuvem.</p>;
  }
  if (handle === undefined) return null;
  return (
    <p className="muted" style={{ fontSize: '12px' }}>
      Pasta local vinculada neste navegador: {handle ? <strong>"{handle.name}"</strong> : <span>nenhuma ainda — a primeira planilha enviada vai pedir pra você escolher.</span>}
      {' '}<button className="mini ghost" onClick={trocarPasta} disabled={trocando}>{trocando ? '...' : (handle ? 'Trocar pasta' : 'Escolher pasta agora')}</button>
      {handle ? <span> (o navegador não mostra o caminho completo por segurança — se não lembra qual pasta é essa, clique em "Trocar pasta" e escolha de novo)</span> : null}
      {erro ? <span style={{ color: '#ff8a8a' }}> {erro}</span> : null}
    </p>
  );
}

function slugPasta(texto) {
  return String(texto || 'SEM_INFO').trim().replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').toUpperCase().slice(0, 80);
}

async function organizarArquivoLocal(pastaBase, contexto, blob, nomeArquivo) {
  let dir = pastaBase;
  const partes = [slugPasta(contexto.cliente), slugPasta(contexto.estado), slugPasta(contexto.municipio), slugPasta(contexto.fazenda)];
  for (const parte of partes) {
    dir = await dir.getDirectoryHandle(parte, { create: true });
  }
  const pontoExt = nomeArquivo.lastIndexOf('.');
  const base = pontoExt >= 0 ? nomeArquivo.slice(0, pontoExt) : nomeArquivo;
  const ext = pontoExt >= 0 ? nomeArquivo.slice(pontoExt) : '';
  const baseSemVersao = base.replace(/_v\d+$/i, '');

  const existentes = [];
  for await (const [nome] of dir.entries()) {
    if (nome.toLowerCase().indexOf(baseSemVersao.toLowerCase()) === 0) existentes.push(nome);
  }
  let nomeFinal = nomeArquivo;
  let revisao = 1;
  if (existentes.length > 0) {
    revisao = existentes.length + 1;
    nomeFinal = baseSemVersao + '_v' + revisao + ext;
  }
  const fileHandle = await dir.getFileHandle(nomeFinal, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(blob);
  await writable.close();

  const caminhoRelativo = partes.join('/') + '/' + nomeFinal;
  return { caminhoRelativo: caminhoRelativo, revisao: revisao };
}

// ============================================================================
// Extracao de dados do .xlsb (aba PROPOSTA + FICHA_TECNICA) -- mesmas
// coordenadas de celula validadas no script Python, agora rodando no
// navegador via SheetJS (XLSX.read) para nao depender de terminal.
// ============================================================================
const MAPA_PROPOSTA = {
  nome: [3, 5], proposta: [3, 14], pivo_opcao: [3, 18],
  propriedade: [5, 5], municipio: [5, 14], estado: [5, 18],
  modelo: [6, 9], marca: [6, 11], composicao: [7, 5],
};
// Encargos/Desconto/Taxa Flat NAO sao mais digitados a mao -- vem direto da
// linha "Sub Total D - PIVO" da aba PROPOSTA (mesma fonte ja usada para
// preco_total/preco_parte_aerea/montagem/servicos_adicionais), coordenadas
// validadas contra 4 planilhas reais do mesmo cliente (valores identicos:
// encargos=10%, desconto=40%, taxa flat=0% nas 4). Montagem/Servicos
// Adicionais aqui sao o total DESTE pivo apenas -- o servidor soma com os
// demais pivos do projeto para chegar no total da negociacao.
const MAPA_TOTAIS = {
  preco_total: [260, 28], preco_parte_aerea: [259, 28],
  montagem: [260, 26], servicos_adicionais: [260, 27],
  encargos_pct: [259, 23], desconto_pct: [259, 24], taxa_flat_pct: [259, 25],
};
const MAPA_FICHA = {
  area_irrigada_ha: [23, 9],
  potencia_motobomba_cv: [6, 94],
  perda_carga_parte_aerea_mca: [10, 23],
  bomba_nome: [46, 5],
  bomba_eficiencia_pct: [50, 5],
};
// Trechos da tubulacao adutora (tabela "Tubulacao Adutora", linhas 37-41 na
// FICHA_TECNICA): coluna 3 = comprimento (m), coluna 4 = diametro interno
// (mm), coluna 8 = material com classe de pressao embutida (ex "PVC 300/125"
// = DN300 PN125). Coordenadas validadas por soma manual contra o total de
// "perda fric. adutora" da propria planilha.
function extrairAdutora(ficha) {
  const trechos = [];
  for (let r = 37; r <= 41; r++) {
    const comprimento = lerCelula(ficha, r, 3);
    if (!comprimento || Number(comprimento) <= 0) continue;
    const material = lerCelula(ficha, r, 8);
    const partes = String(material || '').trim().split('/');
    const pn = partes.length > 1 ? partes[1].trim() : null;
    const dn = partes.length > 0 ? (partes[0].match(/(\d+)/) || [])[1] : null;
    trechos.push({
      comprimento_m: Number(comprimento),
      diametro_mm: Number(lerCelula(ficha, r, 4)) || null,
      diametro_nominal_mm: dn ? Number(dn) : null,
      pn: pn,
      material: material || null,
    });
  }
  return trechos;
}

function lerCelula(sheet, r, c) {
  const addr = XLSX.utils.encode_cell({ r: r, c: c });
  return sheet[addr] ? sheet[addr].v : undefined;
}

function extrairPivoDoArrayBuffer(arrayBuffer, nomeArquivo) {
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const proposta = wb.Sheets['PROPOSTA'];
  const ficha = wb.Sheets['FICHA_TECNICA'];
  if (!proposta) throw new Error('Aba PROPOSTA nao encontrada em ' + nomeArquivo);

  const dado = {};
  Object.keys(MAPA_PROPOSTA).forEach(function (k) { dado[k] = lerCelula(proposta, MAPA_PROPOSTA[k][0], MAPA_PROPOSTA[k][1]); });
  Object.keys(MAPA_TOTAIS).forEach(function (k) { dado[k] = lerCelula(proposta, MAPA_TOTAIS[k][0], MAPA_TOTAIS[k][1]) || 0; });
  if (ficha) {
    Object.keys(MAPA_FICHA).forEach(function (k) { dado[k] = lerCelula(ficha, MAPA_FICHA[k][0], MAPA_FICHA[k][1]); });
    dado.adutora_trechos = extrairAdutora(ficha);
  } else {
    dado.adutora_trechos = [];
  }

  const m = nomeArquivo.match(/PC[\s_-]*0*(\d+)/i);
  dado.numero_pivo = m ? ('PC ' + String(m[1]).padStart(2, '0')) : String(dado.pivo_opcao || '').trim();
  dado.nome_arquivo_original = nomeArquivo;
  return dado;
}

function Login(props) {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState(null);
  const [carregando, setCarregando] = useState(false);

  function entrar(e) {
    e.preventDefault();
    setErro(null); setCarregando(true);
    api('/login', { method: 'POST', body: JSON.stringify({ email: email, senha: senha }) })
      .then(function (d) { props.onLogin(d.token, d.usuario); })
      .catch(function (err) { setErro(err.message); })
      .then(function () { setCarregando(false); });
  }

  return (
    <div className="login-wrap">
      <form className="card" onSubmit={entrar}>
        <h1>PIVOT Deal Manager</h1>
        <p className="sub">Hierarquia: diretor &gt; gerente &gt; vendedor</p>
        <label>E-mail</label>
        <input type="email" value={email} onChange={function (e) { setEmail(e.target.value); }} placeholder="nome.sobrenome@pivot.com.br" required />
        <label>Senha</label>
        <input type="password" value={senha} onChange={function (e) { setSenha(e.target.value); }} required />
        <div style={{ height: '16px' }} />
        <button type="submit" style={{ width: '100%' }} disabled={carregando}>
          {carregando ? 'Entrando...' : 'Entrar'}
        </button>
        {erro ? <div className="err">{erro}</div> : null}
      </form>
    </div>
  );
}

// Novo projeto nasce 100% da planilha: o usuario so escolhe o(s) arquivo(s)
// .xlsb do cliente. O sistema le a aba PROPOSTA, extrai cliente/estado/
// municipio/fazenda + os dados tecnicos e monetarios de cada pivo, cria o
// projeto automaticamente com esses dados e organiza os arquivos na pasta
// local escolhida pelo usuario (perguntada na primeira vez, com
// versionamento automatico caso o arquivo ja exista).
function NovoProjeto(props) {
  const inputRef = React.useRef(null);
  const [status, setStatus] = useState(null);
  const [erro, setErro] = useState(null);
  const [enviando, setEnviando] = useState(false);

  async function aoSelecionarArquivos(ev) {
    const arquivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (arquivos.length === 0) return;
    setEnviando(true);
    setErro(null);
    setStatus('Lendo planilha(s)...');

    let pastaBase = null;
    if (SUPORTA_PASTA_LOCAL) {
      try { pastaBase = await obterPastaBase(); }
      catch (e) { setStatus('Pasta local não selecionada -- os dados ainda serão extraídos e salvos no sistema. (' + e.message + ')'); }
    }

    let projeto = null;
    try {
      for (let i = 0; i < arquivos.length; i++) {
        const arquivo = arquivos[i];
        setStatus('Extraindo dados de ' + arquivo.name + ' (' + (i + 1) + '/' + arquivos.length + ')...');
        const buffer = await arquivo.arrayBuffer();
        const dado = extrairPivoDoArrayBuffer(buffer, arquivo.name);

        if (!projeto) {
          setStatus('Criando projeto de ' + (dado.nome || 'cliente') + '...');
          projeto = await api('/projetos', {
            method: 'POST', body: JSON.stringify({
              cliente: dado.nome || 'Cliente (' + arquivo.name + ')',
              estado: dado.estado || '',
              municipio: dado.municipio || '',
              fazenda: dado.propriedade || ''
            })
          }, props.token);
        }

        let caminhoLocal = null, revisao = 1;
        if (pastaBase) {
          setStatus('Organizando ' + arquivo.name + ' na pasta local...');
          const r = await organizarArquivoLocal(pastaBase, { cliente: projeto.cliente, estado: projeto.estado, municipio: projeto.municipio, fazenda: projeto.fazenda }, arquivo, arquivo.name);
          caminhoLocal = r.caminhoRelativo; revisao = r.revisao;
        }

        setStatus('Salvando dados do ' + dado.numero_pivo + '...');
        const pivo = await api('/pivos', {
          method: 'POST', body: JSON.stringify(Object.assign({}, dado, {
            projeto_id: projeto.id, caminho_local: caminhoLocal, revisao: revisao
          }))
        }, props.token);

        setStatus('Enviando arquivo original ' + arquivo.name + '...');
        const fd = new FormData();
        fd.append('arquivo', arquivo, arquivo.name);
        fd.append('projeto_id', projeto.id);
        fd.append('pivo_id', pivo.id);
        fd.append('tipo', 'pivo');
        await api('/arquivos', { method: 'POST', body: fd }, props.token);
      }
      setStatus(null);
      props.onChange();
      props.onAbrir(projeto.id);
    } catch (e) {
      setErro('Erro: ' + e.message + (projeto ? ' (o projeto "' + projeto.cliente + '" já foi criado -- abra-o para tentar reenviar o pivô que falhou)' : ''));
    }
    setEnviando(false);
  }

  return (
    <div style={{ marginBottom: '20px' }}>
      <button
        className="novo-projeto-btn"
        title="Novo projeto -- selecionar planilha(s) de pivô (.xlsb)"
        disabled={enviando}
        onClick={function () { inputRef.current.click(); }}
      >
        {enviando ? 'Processando…' : '+ Novo projeto'}
      </button>
      <input ref={inputRef} type="file" accept=".xlsb" multiple style={{ display: 'none' }} onChange={aoSelecionarArquivos} />
      {!SUPORTA_PASTA_LOCAL ? <p className="muted" style={{ fontSize: '11px', margin: '8px 0 0' }}>Este navegador não organiza a pasta local automaticamente (use Chrome/Edge).</p> : null}
      {status ? <p className="muted" style={{ fontSize: '11px', margin: '8px 0 0' }}>{status}</p> : null}
      {erro ? <div className="err" style={{ margin: '8px 0 0', fontSize: '11px' }}>{erro}</div> : null}
    </div>
  );
}

function EnviarPivo(props) {
  const [destinatarios, setDestinatarios] = useState([]);
  const [destinatarioId, setDestinatarioId] = useState('');
  const [status, setStatus] = useState(null);
  const [resultados, setResultados] = useState(null);
  const [enviando, setEnviando] = useState(false);

  useEffect(function () {
    api('/usuarios/destinatarios', {}, props.token).then(setDestinatarios).catch(function () { setDestinatarios([]); });
  }, [props.token]);

  async function aoSelecionarArquivos(ev) {
    const arquivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (arquivos.length === 0) return;
    setEnviando(true);
    setResultados(null);
    let pastaBase = null;
    if (SUPORTA_PASTA_LOCAL) {
      try { pastaBase = await obterPastaBase(); }
      catch (e) { setStatus('Organização local cancelada/negada -- enviando só pra nuvem. (' + e.message + ')'); }
    }
    const resultadosLote = [];
    for (const arquivo of arquivos) {
      setStatus('Lendo ' + arquivo.name + '...');
      let pivo = null;
      try {
        const buffer = await arquivo.arrayBuffer();
        const dado = extrairPivoDoArrayBuffer(buffer, arquivo.name);

        let caminhoLocal = null, revisao = 1;
        if (pastaBase) {
          setStatus('Organizando ' + arquivo.name + ' na pasta local...');
          const r = await organizarArquivoLocal(pastaBase, props.projeto, arquivo, arquivo.name);
          caminhoLocal = r.caminhoRelativo; revisao = r.revisao;
        }

        setStatus('Salvando dados do ' + dado.numero_pivo + '...');
        pivo = await api('/pivos', {
          method: 'POST', body: JSON.stringify(Object.assign({}, dado, {
            projeto_id: props.projeto.id, caminho_local: caminhoLocal, revisao: revisao
          }))
        }, props.token);

        // Dado o pivo salvo, o anexo do arquivo é tratado à parte: se falhar
        // aqui, o pivô já existe no banco e isso não pode ficar escondido
        // atrás do status do próximo arquivo do lote (era a causa do
        // "5 pivôs mas só 2 arquivos").
        try {
          setStatus('Enviando arquivo original...');
          const fd = new FormData();
          fd.append('arquivo', arquivo, arquivo.name);
          fd.append('projeto_id', props.projeto.id);
          fd.append('pivo_id', pivo.id);
          fd.append('tipo', 'pivo');
          if (destinatarioId) fd.append('destinatario_id', destinatarioId);
          await api('/arquivos', { method: 'POST', body: fd }, props.token);
          resultadosLote.push({ nome: arquivo.name, ok: true, msg: dado.numero_pivo + (pivo.nova_versao ? ' atualizado para a v' + pivo.revisao + ' (negociação já feita foi mantida).' : ' enviado com sucesso.') });
        } catch (e2) {
          resultadosLote.push({ nome: arquivo.name, ok: false, msg: dado.numero_pivo + ' (v' + pivo.revisao + ') foi salvo no sistema, MAS o arquivo da planilha falhou ao anexar: ' + e2.message + '. Os dados estão ok; reenvie este arquivo para guardar a planilha original.' });
        }
      } catch (e) {
        resultadosLote.push({ nome: arquivo.name, ok: false, msg: 'Erro ao processar ' + arquivo.name + ': ' + e.message + '. Nada foi salvo para este arquivo.' });
      }
    }
    setEnviando(false);
    setStatus(null);
    setResultados(resultadosLote);
    props.onChange();
  }

  const temErro = resultados && resultados.some(function (r) { return !r.ok; });

  return (
    <div className="panel">
      <h2>Enviar planilha de pivô (.xlsb)</h2>
      <PastaLocalStatus />
      <div className="row">
        <select value={destinatarioId} onChange={function (e) { setDestinatarioId(e.target.value); }} style={{ maxWidth: '260px' }}>
          <option value="">Não enviar para aprovação (só salvar)</option>
          {destinatarios.map(function (u) { return <option key={u.id} value={u.id}>Enviar para {u.nome} ({u.nivel})</option>; })}
        </select>
        <input type="file" accept=".xlsb" multiple onChange={aoSelecionarArquivos} disabled={enviando} />
      </div>
      {status ? <p className="muted" style={{ marginTop: '10px' }}>{status}</p> : null}
      {resultados ? (
        <div style={{ marginTop: '10px', fontSize: '13px', background: temErro ? '#3a1414' : 'transparent', border: temErro ? '1px solid #7a2b2b' : 'none', borderRadius: '6px', padding: temErro ? '8px 10px' : 0 }}>
          {resultados.map(function (r, i) {
            return <div key={i} style={{ color: r.ok ? '#8a8f98' : '#ff8a8a', marginBottom: '2px' }}>{r.ok ? '✓ ' : '⚠ '}{r.msg}</div>;
          })}
          <button className="mini ghost" style={{ marginTop: '6px' }} onClick={function () { setResultados(null); }}>Ok, entendi</button>
        </div>
      ) : null}
    </div>
  );
}

// Botao "Encaminhar" -- so aparece numa linha de arquivo ja aceito que NAO
// foi eu quem enviei (ou seja, eu sou destinatario e aceitei), e so se eu
// tiver um superior direto pra quem encaminhar (diretor nao tem).
function BotaoEncaminhar(props) {
  const [destinatarios, setDestinatarios] = useState(null);
  const [aberto, setAberto] = useState(false);
  const [destId, setDestId] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(function () {
    api('/usuarios/destinatarios', {}, props.token).then(setDestinatarios).catch(function () { setDestinatarios([]); });
  }, [props.token]);

  if (!destinatarios || destinatarios.length === 0) return null;

  function encaminhar() {
    if (!destId) return;
    setEnviando(true);
    api('/arquivos/' + props.arquivoId + '/encaminhar', { method: 'POST', body: JSON.stringify({ destinatario_id: destId }) }, props.token)
      .then(function () { setMsg('Encaminhado.'); setAberto(false); if (props.onEncaminhado) props.onEncaminhado(); })
      .catch(function (e) { setMsg('Erro: ' + e.message); })
      .then(function () { setEnviando(false); });
  }

  if (!aberto) {
    return (
      <span>
        <button className="mini ghost" onClick={function () { setAberto(true); }}>Encaminhar</button>
        {msg ? <span className="muted" style={{ fontSize: '11px', marginLeft: '4px' }}>{msg}</span> : null}
      </span>
    );
  }
  return (
    <span className="row" style={{ flexWrap: 'nowrap' }}>
      <select value={destId} onChange={function (e) { setDestId(e.target.value); }} style={{ fontSize: '11px' }}>
        <option value="">Pra quem?</option>
        {destinatarios.map(function (u) { return <option key={u.id} value={u.id}>{u.nome} ({u.nivel})</option>; })}
      </select>
      <button className="mini" disabled={enviando || !destId} onClick={encaminhar}>{enviando ? '...' : 'Ok'}</button>
      <button className="mini ghost" onClick={function () { setAberto(false); }}>X</button>
    </span>
  );
}

function ArquivosDoProjeto(props) {
  const [arquivos, setArquivos] = useState([]);
  const [baixando, setBaixando] = useState(null);
  useEffect(function () {
    api('/arquivos?projeto_id=' + props.projetoId, {}, props.token).then(setArquivos).catch(function () { setArquivos([]); });
  }, [props.projetoId, props.token, props.versao]);

  function baixar(a) {
    setBaixando(a.id);
    api('/arquivos/' + a.id + '/link', {}, props.token)
      .then(function (r) { window.open(r.url, '_blank'); })
      .catch(function (e) { alert('Erro ao baixar: ' + e.message); })
      .then(function () { setBaixando(null); });
  }

  const meuId = props.usuario ? props.usuario.id : null;
  const pivos = props.pivos || [];
  const pivoPorId = {};
  pivos.forEach(function (p) { pivoPorId[p.id] = p; });

  const arquivosDePivo = arquivos.filter(function (a) { return a.tipo === 'pivo'; });
  // Regra do sistema: arquivo nao e cloud publico de todo mundo que acessa o
  // projeto -- so aparece aqui pra quem enviou ou pra quem recebeu E aceitou
  // (vendedor -> seu gerente -> diretor, um passo de cada vez). Por isso,
  // quando um pivô aparece aqui sem a planilha, pode ser (a) o anexo
  // realmente falhou no envio (ver BotaoUploadRapido/EnviarPivo), ou (b) o
  // arquivo existe mas ainda nao foi compartilhado com QUEM ESTA OLHANDO
  // agora -- nao da pra saber qual dos dois daqui, por isso o aviso cobre
  // as duas possibilidades em vez de afirmar que o arquivo sumiu.
  const pivosSemArquivo = pivos.filter(function (p) {
    return !arquivosDePivo.some(function (a) { return a.pivo_id === p.id; });
  });

  if (arquivos.length === 0 && pivosSemArquivo.length === 0) return null;

  return (
    <div className="panel">
      <h2>Arquivos ({arquivos.length})</h2>
      <p className="muted" style={{ marginTop: '-6px', marginBottom: '10px' }}>
        Cada arquivo só aparece aqui pra quem o enviou ou pra quem recebeu e aceitou o envio (vendedor → seu gerente → diretor) -- não é uma pasta pública do projeto.
        {' '}{SUPORTA_PASTA_LOCAL
          ? 'Ao aceitar um envio, seu navegador também organiza uma cópia na sua pasta local (Cliente/Estado/Município/Fazenda).'
          : 'Este navegador não organiza cópia na pasta local automaticamente (use Chrome/Edge no computador) -- o "Baixar" abaixo sempre funciona, de qualquer navegador.'}
      </p>

      {pivosSemArquivo.length > 0 ? (
        <div className="err" style={{ marginBottom: '12px' }}>
          ⚠ {pivosSemArquivo.length} pivô{pivosSemArquivo.length === 1 ? '' : 's'} sem planilha disponível aqui para você: {pivosSemArquivo.map(function (p) { return p.numero_pivo + ' (v' + p.revisao + ')'; }).join(', ')}.
          Os dados desse(s) pivô(s) estão salvos normalmente. Isso quer dizer: o anexo falhou no envio (reenvie na aba "Pivôs" pra corrigir) OU o arquivo existe mas ainda não foi compartilhado com você -- confira com quem enviou.
        </div>
      ) : null}

      <table>
        <thead><tr><th>Nome</th><th>Tipo</th><th>Pivô / Versão</th><th>Tamanho</th><th>De / Status</th><th></th></tr></thead>
        <tbody>
          {arquivos.map(function (a) {
            const piv = a.pivo_id ? pivoPorId[a.pivo_id] : null;
            const souEu = a.enviado_por === meuId;
            return (
              <tr key={a.id}>
                <td>{a.nome}</td>
                <td className="muted">{a.tipo}</td>
                <td className="muted">{piv ? piv.numero_pivo + ' · v' + piv.revisao : '-'}</td>
                <td className="muted">{(a.tamanho / 1024).toFixed(0)} KB</td>
                <td className="muted">{souEu ? 'enviado por você' : 'recebido · ' + a.status}</td>
                <td>
                  <div className="row" style={{ flexWrap: 'nowrap' }}>
                    <button className="mini ghost" disabled={baixando === a.id} onClick={function () { baixar(a); }}>{baixando === a.id ? '...' : 'Baixar'}</button>
                    {!souEu && a.status === 'aceito' ? <BotaoEncaminhar arquivoId={a.id} token={props.token} /> : null}
                  </div>
                </td>
              </tr>
            );
          })}
          {arquivos.length === 0 ? <tr><td colSpan={6} className="muted">Nenhum arquivo disponível para você aqui ainda.</td></tr> : null}
        </tbody>
      </table>
    </div>
  );
}

function HistoricoPivo(props) {
  const [lista, setLista] = useState(null);
  useEffect(function () {
    api('/pivos/' + props.pivoId + '/historico', {}, props.token).then(setLista).catch(function () { setLista([]); });
  }, [props.pivoId, props.token]);

  if (lista === null) return <p className="muted">Carregando histórico...</p>;
  if (lista.length === 0) return <p className="muted">Esta é a primeira versão enviada -- sem histórico anterior.</p>;
  return (
    <table>
      <thead><tr><th>Versão</th><th>Área</th><th>Valor Negociado</th><th>Desconto</th><th>Arquivo</th><th>Substituído em</th></tr></thead>
      <tbody>
        {lista.map(function (h) {
          const d = h.dados || {};
          return (
            <tr key={h.id}>
              <td>v{h.revisao}</td>
              <td>{numero(d.area_irrigada_ha, 1)} ha</td>
              <td>{brl(d.valor_negociado)}</td>
              <td>{d.desconto_pct}%</td>
              <td className="muted">{d.nome_arquivo_original || '-'}</td>
              <td className="muted">{new Date(h.created_at).toLocaleString('pt-BR')}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

// Cada parametro comercial (Encargos/Desconto/Taxa Flat/Montagem/Serv.
// Adicionais) e a SUA PROPRIA coluna, sempre editavel -- igual a aba
// "Calculo" da Calculadora, onde cada um e uma celula separada e muda o
// valor negociado na hora. Sem modo de edicao escondido atras de lapis:
// e so digitar e sair do campo (onBlur) que salva e recalcula tudo.
// Os parametros comerciais (Encargos/Desconto/Taxa Flat/Montagem/Servicos
// Adicionais) NAO sao mais editados aqui -- sao unicos por negociacao e
// ficam no painel "Parametros comerciais da negociacao" (ver

function paraDataISO(d) {
  if (!d) return '';
  if (typeof d === 'string') return d.slice(0, 10);
  const pad = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function formatarDataBR(iso) {
  if (!iso) return '-';
  const partes = String(iso).slice(0, 10).split('-');
  if (partes.length !== 3) return '-';
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}
function somarDias(dataBase, dias) {
  const d = new Date(dataBase.getFullYear(), dataBase.getMonth(), dataBase.getDate());
  d.setDate(d.getDate() + dias);
  return d;
}

// Forma de pagamento / financiamento -- replica a aba RESUMO da
// Calculadora.xlsm. Formula de "Valor futuro" validada contra planilha real
// (cliente Paula Abreu Barcellos, 2026-10-18): parcela que vence ANTES da
// "Data de entrega requerida" nao tem juros; depois, principal composto
// mensalmente, pro-rata por dia: principal * (1+juros_am)^(dias/30).
// "Data de entrega requerida" = hoje (dia que a proposta e vista/impressa)
// + 30 + dias_adicionais -- igual a planilha (usa a data do documento, nao
// a data do pedido).
function FinanciamentoProposta(props) {
  const p = props.projeto;
  const valorTotal = props.valorTotal;
  const [editando, setEditando] = useState(false);
  const [exibir, setExibir] = useState(!!p.exibir_forma_pagamento);
  const [distribuidor, setDistribuidor] = useState(p.distribuidor || '');
  const [pedidoData, setPedidoData] = useState(paraDataISO(p.pedido_data));
  const [diasAdicionais, setDiasAdicionais] = useState(p.dias_adicionais != null ? p.dias_adicionais : 20);
  const [jurosPct, setJurosPct] = useState(p.juros_am_pct != null ? p.juros_am_pct : 1.5);
  const [formaPagamento, setFormaPagamento] = useState(p.forma_pagamento || 'Financiamento');
  const [parcelas, setParcelas] = useState((props.parcelas || []).map(function (x) {
    return { pagamento: x.pagamento, data_vencimento: paraDataISO(x.data_vencimento), porcentagem: x.porcentagem };
  }));
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState(null);

  const dataEntregaRequerida = somarDias(new Date(), 30 + (Number(diasAdicionais) || 0));

  function valorPrincipal(pct) { return valorTotal * (Number(pct) || 0) / 100; }
  function valorFuturo(parc) {
    const principal = valorPrincipal(parc.porcentagem);
    if (!parc.data_vencimento) return principal;
    const partes = parc.data_vencimento.split('-').map(Number);
    const venc = new Date(partes[0], partes[1] - 1, partes[2]);
    if (venc < dataEntregaRequerida) return principal;
    const dias = (venc - dataEntregaRequerida) / (1000 * 60 * 60 * 24);
    return principal * Math.pow(1 + (Number(jurosPct) || 0) / 100, dias / 30);
  }

  const somaPct = parcelas.reduce(function (s, x) { return s + (Number(x.porcentagem) || 0); }, 0);
  const somaPrincipal = parcelas.reduce(function (s, x) { return s + valorPrincipal(x.porcentagem); }, 0);
  const somaFuturo = parcelas.reduce(function (s, x) { return s + valorFuturo(x); }, 0);
  const valorParcelado = parcelas
    .filter(function (x) { return String(x.pagamento || '').trim().toLowerCase() === 'parcelado'; })
    .reduce(function (s, x) { return s + valorPrincipal(x.porcentagem); }, 0);

  function addParcela() { setParcelas(parcelas.concat([{ pagamento: '', data_vencimento: '', porcentagem: 0 }])); }
  function removerParcela(i) { setParcelas(parcelas.filter(function (_, idx) { return idx !== i; })); }
  function mudarParcela(i, campo, valor) {
    setParcelas(parcelas.map(function (x, idx) { return idx === i ? Object.assign({}, x, { [campo]: valor }) : x; }));
  }

  function salvar() {
    setSalvando(true);
    setErro(null);
    api('/projetos/' + p.id + '/financiamento', {
      method: 'PUT', body: JSON.stringify({
        distribuidor: distribuidor, pedido_data: pedidoData || null, exibir_forma_pagamento: exibir,
        forma_pagamento: formaPagamento, dias_adicionais: Number(diasAdicionais), juros_am_pct: Number(jurosPct)
      })
    }, props.token)
      .then(function () {
        return api('/projetos/' + p.id + '/parcelas', { method: 'PUT', body: JSON.stringify({ parcelas: parcelas }) }, props.token);
      })
      .then(function () { setEditando(false); if (props.onChange) props.onChange(); })
      .catch(function (e) { setErro(e.message); })
      .then(function () { setSalvando(false); });
  }

  if (!exibir && !editando) {
    return props.podeEditar ? (
      <div className="no-imprimir" style={{ marginTop: '14px' }}>
        <button className="ghost" onClick={function () { setEditando(true); }}>+ Adicionar dados do pedido / forma de pagamento</button>
      </div>
    ) : null;
  }

  return (
    <div style={{ marginTop: '18px', paddingTop: '14px', borderTop: '1px solid var(--borda)' }}>
      <div className="row no-imprimir" style={{ justifyContent: 'space-between' }}>
        <h2 style={{ margin: 0 }}>Dados do pedido e forma de pagamento</h2>
        {props.podeEditar ? (
          editando ? (
            <div className="row">
              {erro ? <span className="err" style={{ margin: 0 }}>{erro}</span> : null}
              <button className="ghost" onClick={function () { setEditando(false); }} disabled={salvando}>Cancelar</button>
              <button onClick={salvar} disabled={salvando}>{salvando ? 'Salvando...' : 'Salvar'}</button>
            </div>
          ) : (
            <button className="mini ghost" onClick={function () { setEditando(true); }}>Editar</button>
          )
        ) : null}
      </div>

      {editando ? (
        <div className="no-imprimir" style={{ marginTop: '10px' }}>
          <div className="grid-campos">
            <div><label>Distribuidor</label><input value={distribuidor} onChange={function (e) { setDistribuidor(e.target.value); }} /></div>
            <div><label>Data do pedido</label><input type="date" value={pedidoData} onChange={function (e) { setPedidoData(e.target.value); }} /></div>
            <div>
              <label>Forma de pagamento</label>
              <select value={formaPagamento} onChange={function (e) { setFormaPagamento(e.target.value); }}>
                <option value="Financiamento">Financiamento</option>
                <option value="Recurso Próprio">Recurso Próprio</option>
                <option value="Operação Mista">Operação Mista</option>
              </select>
            </div>
            <div><label>Dias adicionais</label><input type="number" value={diasAdicionais} onChange={function (e) { setDiasAdicionais(e.target.value); }} /></div>
            <div><label>Juros (% a.m.)</label><input type="number" step="0.01" value={jurosPct} onChange={function (e) { setJurosPct(e.target.value); }} /></div>
          </div>
          <label className="row" style={{ marginTop: '8px' }}>
            <input type="checkbox" checked={exibir} onChange={function (e) { setExibir(e.target.checked); }} style={{ width: 'auto', height: 'auto' }} />
            Exibir informações sobre forma de pagamento na proposta
          </label>
        </div>
      ) : null}

      {exibir ? (
        <React.Fragment>
          <p className="muted" style={{ margin: editando ? '14px 0 4px' : '4px 0' }}>
            {(distribuidor || p.distribuidor) ? 'Distribuidor: ' + (distribuidor || p.distribuidor) + ' — ' : ''}
            Data de entrega requerida: {formatarDataBR(paraDataISO(dataEntregaRequerida))} &middot; Forma de pagamento: {formaPagamento} &middot; Juros: {numero(jurosPct, 2)}% a.m. &middot; Valor parcelado: {brl(valorParcelado)}
          </p>
          <table style={{ marginTop: '8px' }}>
            <thead>
              <tr><th>Parcela</th><th>Pagamento</th><th>Data vencimento</th><th>%</th><th>Valor principal</th><th>Valor futuro</th>{editando ? <th className="no-imprimir"></th> : null}</tr>
            </thead>
            <tbody>
              {parcelas.map(function (parc, i) {
                return (
                  <tr key={i}>
                    <td>{i + 1}</td>
                    <td>{editando ? <input value={parc.pagamento} onChange={function (e) { mudarParcela(i, 'pagamento', e.target.value); }} /> : parc.pagamento}</td>
                    <td>{editando ? <input type="date" value={parc.data_vencimento} onChange={function (e) { mudarParcela(i, 'data_vencimento', e.target.value); }} /> : formatarDataBR(parc.data_vencimento)}</td>
                    <td>{editando ? <input type="number" step="0.01" className="campo-mini" value={parc.porcentagem} onChange={function (e) { mudarParcela(i, 'porcentagem', e.target.value); }} /> : numero(parc.porcentagem, 2) + '%'}</td>
                    <td>{brl(valorPrincipal(parc.porcentagem))}</td>
                    <td>{brl(valorFuturo(parc))}</td>
                    {editando ? <td className="no-imprimir"><button className="mini ghost" onClick={function () { removerParcela(i); }}>X</button></td> : null}
                  </tr>
                );
              })}
              {parcelas.length === 0 ? <tr><td colSpan={editando ? 7 : 6} className="muted">Nenhuma parcela.</td></tr> : null}
              <tr>
                <td colSpan={3}><strong>Totais</strong></td>
                <td><strong>{numero(somaPct, 2)}%</strong></td>
                <td><strong>{brl(somaPrincipal)}</strong></td>
                <td><strong>{brl(somaFuturo)}</strong></td>
                {editando ? <td className="no-imprimir"></td> : null}
              </tr>
            </tbody>
          </table>
          {editando ? <button className="ghost no-imprimir" style={{ marginTop: '8px' }} onClick={addParcela}>+ Parcela</button> : null}
        </React.Fragment>
      ) : null}
    </div>
  );
}
