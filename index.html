<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIVOT Deal Manager WEB</title>
<style>
  /* Paleta extraida do site institucional pivot.com.br (preto/cinza neutro + vermelho de
     acao -- a Pivot nao usa azul em lugar nenhum, entao todo tom frio/azulado foi
     trocado por cinza neutro). */
  :root { --preto:#191b21; --vermelho:#eb0024; --cinza:#f3f3f3; --borda:#e3e3e3; --vermelho-claro:#fdeaea; --texto-sutil:#6b6f73; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--cinza); color:#212529; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:14px; padding:28px; width:100%; max-width:380px; box-shadow:0 8px 24px rgba(25,27,33,.08); }
  .card h1 { margin:0 0 4px; font-size:20px; }
  .card p.sub { margin:0 0 20px; font-size:12px; color:var(--texto-sutil); }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; height:42px; border:1px solid var(--borda); border-radius:9px; padding:0 12px; font-size:14px; background:#fafafa; }
  button { height:42px; border:0; border-radius:9px; background:var(--vermelho); color:#fff; font-weight:600; font-size:14px; cursor:pointer; padding:0 16px; }
  button.ghost { background:#fff; color:var(--vermelho); border:1px solid var(--vermelho); }
  button.mini { height:30px; font-size:12px; padding:0 10px; }
  button.perigo { background:#fff; color:#9f1239; border:1px solid #fecdd3; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .err { background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; padding:10px; border-radius:9px; font-size:12px; margin-top:14px; }
  .ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; padding:10px; border-radius:9px; font-size:12px; margin-top:14px; }
  .badge { position:absolute; top:-6px; right:-6px; background:#c0392b; color:#fff; font-size:10px; border-radius:999px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  main { padding:22px; max-width:1200px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:14px; }
  .kpi span { display:block; font-size:11px; text-transform:uppercase; color:var(--texto-sutil); letter-spacing:.03em; }
  .kpi strong { font-size:22px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--borda); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid #ececec; }
  th { background:#f6f6f6; font-size:11px; text-transform:uppercase; color:var(--texto-sutil); }
  tr.clicavel { cursor:pointer; }
  tr.clicavel:hover { background:#f6f6f6; }
  .tag { font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; }
  .tag.em_negociacao { background:#fff5e0; color:#8c520a; }
  .tag.aprovado, .tag.aceito { background:#ecfdf5; color:#065f46; }
  .tag.reprovado, .tag.recusado { background:#fff1f2; color:#9f1239; }
  .tag.pendente { background:#ececed; color:#32323a; }
  .panel { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:15px; }
  .muted { font-size:12px; color:var(--texto-sutil); }
  .campo-mini { width:76px; height:30px; padding:0 8px; text-align:right; }
  .voltar { background:none; color:var(--vermelho); height:auto; padding:0; font-size:13px; font-weight:600; margin-bottom:12px; }
  .grid-campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; margin:8px 0; }
  .grid-campos label { margin:0 0 2px; font-size:10px; }
  .app-shell { display:flex; min-height:100vh; align-items:stretch; }
  .sidebar { width:260px; flex-shrink:0; background:#fff; border-right:1px solid var(--borda); padding:20px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .sidebar .brand { font-weight:800; font-size:18px; color:var(--preto); letter-spacing:.01em; }
  .sidebar .brand-sub { font-size:10px; color:var(--texto-sutil); letter-spacing:.06em; margin:2px 0 22px; }
  .sidebar nav.secao { margin-bottom:18px; }
  .sidebar nav.secao .titulo { font-size:10px; color:var(--texto-sutil); text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px 8px; }
  .sidebar nav.secao button { width:100%; text-align:left; background:none; border:0; color:#3a3d42; height:40px; padding:0 10px; border-radius:9px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:2px; }
  .sidebar nav.secao button:hover { background:#f6f6f6; }
  .sidebar nav.secao button.ativo { background:#ececed; color:var(--preto); font-weight:700; position:relative; padding-left:16px; }
  .sidebar nav.secao button.ativo::before { content:''; position:absolute; left:4px; top:7px; bottom:7px; width:3px; border-radius:3px; background:var(--preto); }
  .sidebar .badge-inline { background:#c0392b; color:#fff; font-size:10px; border-radius:999px; min-width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; margin-left:auto; }
  .sidebar .perfil { margin-top:auto; display:flex; align-items:center; gap:10px; padding-top:16px; border-top:1px solid var(--borda); }
  .sidebar .avatar { width:34px; height:34px; border-radius:999px; background:var(--preto); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .novo-projeto-btn { width:100%; background:var(--vermelho); color:#fff; font-weight:700; border-radius:10px; height:44px; border:0; cursor:pointer; font-size:14px; }
  .novo-projeto-btn:disabled { opacity:.6; cursor:not-allowed; }
  .conteudo { flex:1; min-width:0; }
  @media print {
    body * { visibility: hidden; }
    #resumo-comercial-imprimir, #resumo-comercial-imprimir * { visibility: visible; }
    #resumo-comercial-imprimir { position: absolute; left: 0; top: 0; width: 100%; }
    .no-imprimir { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = '';

function api(path, options, token) {
  const opts = options || {};
  const headers = Object.assign({}, opts.headers || {});
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, Object.assign({}, opts, { headers: headers })).then(function (r) {
    return r.text().then(function (t) {
      let data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = { erro: t }; }
      if (!r.ok) throw new Error((data && data.erro) || ('Falha HTTP ' + r.status));
      return data;
    });
  });
}
const ROTULOS_STATUS = { em_negociacao: 'Em negociação', aprovado: 'Aprovado', reprovado: 'Reprovado', aceito: 'Aceito', recusado: 'Recusado', pendente: 'Pendente' };
function formatarStatus(status) { return ROTULOS_STATUS[status] || status; }
function iniciais(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  const a = partes[0] ? partes[0][0] : '';
  const b = partes.length > 1 ? partes[partes.length - 1][0] : '';
  return (a + b).toUpperCase();
}
function brl(v) {
  return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function numero(v, casas) {
  return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0 });
}

// ============================================================================
// Organizacao local de arquivos (File System Access API -- Chrome/Edge).
// A pasta raiz e escolhida uma vez pelo usuario e lembrada no IndexedDB deste
// navegador/computador. Cada arquivo e organizado em Cliente/Estado/
// Municipio/Fazenda/, com versionamento (v2, v3... todas na mesma pasta).
// ============================================================================
const SUPORTA_PASTA_LOCAL = typeof window.showDirectoryPicker === 'function';

function idbAbrir() {
  return new Promise(function (resolve, reject) {
    const req = indexedDB.open('pivot-local', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('handles'); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbGet(chave) {
  return idbAbrir().then(function (db) {
    return new Promise(function (resolve, reject) {
      const tx = db.transaction('handles', 'readonly').objectStore('handles').get(chave);
      tx.onsuccess = function () { resolve(tx.result); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}
function idbSet(chave, valor) {
  return idbAbrir().then(function (db) {
    return new Promise(function (resolve, reject) {
      const tx = db.transaction('handles', 'readwrite').objectStore('handles').put(valor, chave);
      tx.onsuccess = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}

async function obterPastaBase() {
  if (!SUPORTA_PASTA_LOCAL) return null;
  let handle = await idbGet('pasta_base').catch(function () { return null; });
  if (handle) {
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') return handle;
    const pedido = await handle.requestPermission({ mode: 'readwrite' });
    if (pedido === 'granted') return handle;
  }
  handle = await window.showDirectoryPicker({ mode: 'readwrite' });
  await idbSet('pasta_base', handle);
  return handle;
}

function slugPasta(texto) {
  return String(texto || 'SEM_INFO').trim().replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').toUpperCase().slice(0, 80);
}

async function organizarArquivoLocal(pastaBase, contexto, blob, nomeArquivo) {
  let dir = pastaBase;
  const partes = [slugPasta(contexto.cliente), slugPasta(contexto.estado), slugPasta(contexto.municipio), slugPasta(contexto.fazenda)];
  for (const parte of partes) {
    dir = await dir.getDirectoryHandle(parte, { create: true });
  }
  const pontoExt = nomeArquivo.lastIndexOf('.');
  const base = pontoExt >= 0 ? nomeArquivo.slice(0, pontoExt) : nomeArquivo;
  const ext = pontoExt >= 0 ? nomeArquivo.slice(pontoExt) : '';
  const baseSemVersao = base.replace(/_v\d+$/i, '');

  const existentes = [];
  for await (const [nome] of dir.entries()) {
    if (nome.toLowerCase().indexOf(baseSemVersao.toLowerCase()) === 0) existentes.push(nome);
  }
  let nomeFinal = nomeArquivo;
  let revisao = 1;
  if (existentes.length > 0) {
    revisao = existentes.length + 1;
    nomeFinal = baseSemVersao + '_v' + revisao + ext;
  }
  const fileHandle = await dir.getFileHandle(nomeFinal, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(blob);
  await writable.close();

  const caminhoRelativo = partes.join('/') + '/' + nomeFinal;
  return { caminhoRelativo: caminhoRelativo, revisao: revisao };
}

// ============================================================================
// Extracao de dados do .xlsb (aba PROPOSTA + FICHA_TECNICA) -- mesmas
// coordenadas de celula validadas no script Python, agora rodando no
// navegador via SheetJS (XLSX.read) para nao depender de terminal.
// ============================================================================
const MAPA_PROPOSTA = {
  nome: [3, 5], proposta: [3, 14], pivo_opcao: [3, 18],
  propriedade: [5, 5], municipio: [5, 14], estado: [5, 18],
  modelo: [6, 9], marca: [6, 11], composicao: [7, 5],
};
const MAPA_TOTAIS = { preco_total: [260, 28], preco_parte_aerea: [259, 28], montagem: [260, 26], servicos_adicionais: [260, 27] };
const MAPA_FICHA = {
  area_irrigada_ha: [23, 9],
  potencia_motobomba_cv: [6, 94],
  perda_carga_parte_aerea_mca: [10, 23],
  bomba_nome: [46, 5],
  bomba_eficiencia_pct: [50, 5],
};
// Trechos da tubulacao adutora (tabela "Tubulacao Adutora", linhas 37-41 na
// FICHA_TECNICA): coluna 3 = comprimento (m), coluna 4 = diametro interno
// (mm), coluna 8 = material com classe de pressao embutida (ex "PVC 300/125"
// = DN300 PN125). Coordenadas validadas por soma manual contra o total de
// "perda fric. adutora" da propria planilha.
function extrairAdutora(ficha) {
  const trechos = [];
  for (let r = 37; r <= 41; r++) {
    const comprimento = lerCelula(ficha, r, 3);
    if (!comprimento || Number(comprimento) <= 0) continue;
    const material = lerCelula(ficha, r, 8);
    const partes = String(material || '').trim().split('/');
    const pn = partes.length > 1 ? partes[1].trim() : null;
    const dn = partes.length > 0 ? (partes[0].match(/(\d+)/) || [])[1] : null;
    trechos.push({
      comprimento_m: Number(comprimento),
      diametro_mm: Number(lerCelula(ficha, r, 4)) || null,
      diametro_nominal_mm: dn ? Number(dn) : null,
      pn: pn,
      material: material || null,
    });
  }
  return trechos;
}

function lerCelula(sheet, r, c) {
  const addr = XLSX.utils.encode_cell({ r: r, c: c });
  return sheet[addr] ? sheet[addr].v : undefined;
}

function extrairPivoDoArrayBuffer(arrayBuffer, nomeArquivo) {
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const proposta = wb.Sheets['PROPOSTA'];
  const ficha = wb.Sheets['FICHA_TECNICA'];
  if (!proposta) throw new Error('Aba PROPOSTA nao encontrada em ' + nomeArquivo);

  const dado = {};
  Object.keys(MAPA_PROPOSTA).forEach(function (k) { dado[k] = lerCelula(proposta, MAPA_PROPOSTA[k][0], MAPA_PROPOSTA[k][1]); });
  Object.keys(MAPA_TOTAIS).forEach(function (k) { dado[k] = lerCelula(proposta, MAPA_TOTAIS[k][0], MAPA_TOTAIS[k][1]) || 0; });
  if (ficha) {
    Object.keys(MAPA_FICHA).forEach(function (k) { dado[k] = lerCelula(ficha, MAPA_FICHA[k][0], MAPA_FICHA[k][1]); });
    dado.adutora_trechos = extrairAdutora(ficha);
  } else {
    dado.adutora_trechos = [];
  }

  const m = nomeArquivo.match(/PC[\s_-]*0*(\d+)/i);
  dado.numero_pivo = m ? ('PC ' + String(m[1]).padStart(2, '0')) : String(dado.pivo_opcao || '').trim();
  dado.nome_arquivo_original = nomeArquivo;
  return dado;
}

// ============================================================================

function Login(props) {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState(null);
  const [carregando, setCarregando] = useState(false);

  function entrar(e) {
    e.preventDefault();
    setErro(null); setCarregando(true);
    api('/login', { method: 'POST', body: JSON.stringify({ email: email, senha: senha }) })
      .then(function (d) { props.onLogin(d.token, d.usuario); })
      .catch(function (err) { setErro(err.message); })
      .then(function () { setCarregando(false); });
  }

  return (
    <div className="login-wrap">
      <form className="card" onSubmit={entrar}>
        <h1>PIVOT Deal Manager</h1>
        <p className="sub">Hierarquia: diretor &gt; gerente &gt; vendedor</p>
        <label>E-mail</label>
        <input type="email" value={email} onChange={function (e) { setEmail(e.target.value); }} placeholder="nome.sobrenome@pivot.com.br" required />
        <label>Senha</label>
        <input type="password" value={senha} onChange={function (e) { setSenha(e.target.value); }} required />
        <div style={{ height: '16px' }} />
        <button type="submit" style={{ width: '100%' }} disabled={carregando}>
          {carregando ? 'Entrando...' : 'Entrar'}
        </button>
        {erro ? <div className="err">{erro}</div> : null}
      </form>
    </div>
  );
}

// Novo projeto nasce 100% da planilha: o usuario so escolhe o(s) arquivo(s)
// .xlsb do cliente. O sistema le a aba PROPOSTA, extrai cliente/estado/
// municipio/fazenda + os dados tecnicos e monetarios de cada pivo, cria o
// projeto automaticamente com esses dados e organiza os arquivos na pasta
// local escolhida pelo usuario (perguntada na primeira vez, com
// versionamento automatico caso o arquivo ja exista).
function NovoProjeto(props) {
  const inputRef = React.useRef(null);
  const [status, setStatus] = useState(null);
  const [erro, setErro] = useState(null);
  const [enviando, setEnviando] = useState(false);

  async function aoSelecionarArquivos(ev) {
    const arquivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (arquivos.length === 0) return;
    setEnviando(true);
    setErro(null);
    setStatus('Lendo planilha(s)...');

    let pastaBase = null;
    if (SUPORTA_PASTA_LOCAL) {
      try { pastaBase = await obterPastaBase(); }
      catch (e) { setStatus('Pasta local não selecionada -- os dados ainda serão extraídos e salvos no sistema. (' + e.message + ')'); }
    }

    let projeto = null;
    try {
      for (let i = 0; i < arquivos.length; i++) {
        const arquivo = arquivos[i];
        setStatus('Extraindo dados de ' + arquivo.name + ' (' + (i + 1) + '/' + arquivos.length + ')...');
        const buffer = await arquivo.arrayBuffer();
        const dado = extrairPivoDoArrayBuffer(buffer, arquivo.name);

        if (!projeto) {
          setStatus('Criando projeto de ' + (dado.nome || 'cliente') + '...');
          projeto = await api('/projetos', {
            method: 'POST', body: JSON.stringify({
              cliente: dado.nome || 'Cliente (' + arquivo.name + ')',
              estado: dado.estado || '',
              municipio: dado.municipio || '',
              fazenda: dado.propriedade || ''
            })
          }, props.token);
        }

        let caminhoLocal = null, revisao = 1;
        if (pastaBase) {
          setStatus('Organizando ' + arquivo.name + ' na pasta local...');
          const r = await organizarArquivoLocal(pastaBase, { cliente: projeto.cliente, estado: projeto.estado, municipio: projeto.municipio, fazenda: projeto.fazenda }, arquivo, arquivo.name);
          caminhoLocal = r.caminhoRelativo; revisao = r.revisao;
        }

        setStatus('Salvando dados do ' + dado.numero_pivo + '...');
        const pivo = await api('/pivos', {
          method: 'POST', body: JSON.stringify(Object.assign({}, dado, {
            projeto_id: projeto.id, caminho_local: caminhoLocal, revisao: revisao
          }))
        }, props.token);

        setStatus('Enviando arquivo original ' + arquivo.name + '...');
        const fd = new FormData();
        fd.append('arquivo', arquivo, arquivo.name);
        fd.append('projeto_id', projeto.id);
        fd.append('pivo_id', pivo.id);
        fd.append('tipo', 'pivo');
        await api('/arquivos', { method: 'POST', body: fd }, props.token);
      }
      setStatus(null);
      props.onChange();
      props.onAbrir(projeto.id);
    } catch (e) {
      setErro('Erro: ' + e.message + (projeto ? ' (o projeto "' + projeto.cliente + '" já foi criado -- abra-o para tentar reenviar o pivô que falhou)' : ''));
    }
    setEnviando(false);
  }

  return (
    <div style={{ marginBottom: '20px' }}>
      <button
        className="novo-projeto-btn"
        title="Novo projeto -- selecionar planilha(s) de pivô (.xlsb)"
        disabled={enviando}
        onClick={function () { inputRef.current.click(); }}
      >
        {enviando ? 'Processando…' : '+ Novo projeto'}
      </button>
      <input ref={inputRef} type="file" accept=".xlsb" multiple style={{ display: 'none' }} onChange={aoSelecionarArquivos} />
      {!SUPORTA_PASTA_LOCAL ? <p className="muted" style={{ fontSize: '11px', margin: '8px 0 0' }}>Este navegador não organiza a pasta local automaticamente (use Chrome/Edge).</p> : null}
      {status ? <p className="muted" style={{ fontSize: '11px', margin: '8px 0 0' }}>{status}</p> : null}
      {erro ? <div className="err" style={{ margin: '8px 0 0', fontSize: '11px' }}>{erro}</div> : null}
    </div>
  );
}

function EnviarPivo(props) {
  const [destinatarios, setDestinatarios] = useState([]);
  const [destinatarioId, setDestinatarioId] = useState('');
  const [status, setStatus] = useState(null);
  const [enviando, setEnviando] = useState(false);

  useEffect(function () {
    api('/usuarios/destinatarios', {}, props.token).then(setDestinatarios).catch(function () { setDestinatarios([]); });
  }, [props.token]);

  async function aoSelecionarArquivos(ev) {
    const arquivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (arquivos.length === 0) return;
    setEnviando(true);
    let pastaBase = null;
    if (SUPORTA_PASTA_LOCAL) {
      try { pastaBase = await obterPastaBase(); }
      catch (e) { setStatus('Organização local cancelada/negada -- enviando só pra nuvem. (' + e.message + ')'); }
    }
    for (const arquivo of arquivos) {
      try {
        setStatus('Lendo ' + arquivo.name + '...');
        const buffer = await arquivo.arrayBuffer();
        const dado = extrairPivoDoArrayBuffer(buffer, arquivo.name);

        let caminhoLocal = null, revisao = 1;
        if (pastaBase) {
          setStatus('Organizando ' + arquivo.name + ' na pasta local...');
          const r = await organizarArquivoLocal(pastaBase, props.projeto, arquivo, arquivo.name);
          caminhoLocal = r.caminhoRelativo; revisao = r.revisao;
        }

        setStatus('Salvando dados do ' + dado.numero_pivo + '...');
        const pivo = await api('/pivos', {
          method: 'POST', body: JSON.stringify(Object.assign({}, dado, {
            projeto_id: props.projeto.id, caminho_local: caminhoLocal, revisao: revisao
          }))
        }, props.token);

        setStatus('Enviando arquivo original...');
        const fd = new FormData();
        fd.append('arquivo', arquivo, arquivo.name);
        fd.append('projeto_id', props.projeto.id);
        fd.append('pivo_id', pivo.id);
        fd.append('tipo', 'pivo');
        if (destinatarioId) fd.append('destinatario_id', destinatarioId);
        await api('/arquivos', { method: 'POST', body: fd }, props.token);

        setStatus(dado.numero_pivo + (pivo.nova_versao ? ' atualizado para a v' + pivo.revisao + ' (negociação já feita foi mantida).' : ' enviado com sucesso.'));
      } catch (e) {
        setStatus('Erro em ' + arquivo.name + ': ' + e.message);
      }
    }
    setEnviando(false);
    props.onChange();
  }

  return (
    <div className="panel">
      <h2>Enviar planilha de pivô (.xlsb)</h2>
      {!SUPORTA_PASTA_LOCAL ? (
        <p className="muted">
          Este navegador não suporta organizar a pasta local automaticamente (funciona no Chrome/Edge).
          O arquivo ainda será enviado e os dados extraídos normalmente.
        </p>
      ) : null}
      <div className="row">
        <select value={destinatarioId} onChange={function (e) { setDestinatarioId(e.target.value); }} style={{ maxWidth: '260px' }}>
          <option value="">Não enviar para aprovação (só salvar)</option>
          {destinatarios.map(function (u) { return <option key={u.id} value={u.id}>Enviar para {u.nome} ({u.nivel})</option>; })}
        </select>
        <input type="file" accept=".xlsb" multiple onChange={aoSelecionarArquivos} disabled={enviando} />
      </div>
      {status ? <p className="muted" style={{ marginTop: '10px' }}>{status}</p> : null}
    </div>
  );
}

function HistoricoPivo(props) {

// Cada parametro comercial (Encargos/Desconto/Taxa Flat/Montagem/Serv.
// Adicionais) e a SUA PROPRIA coluna, sempre editavel -- igual a aba
// "Calculo" da Calculadora, onde cada um e uma celula separada e muda o
// valor negociado na hora. Sem modo de edicao escondido atras de lapis:
// e so digitar e sair do campo (onBlur) que salva e recalcula tudo.
// Os parametros comerciais (Encargos/Desconto/Taxa Flat/Montagem/Servicos
// Adicionais) NAO sao mais editados aqui -- sao unicos por negociacao e
// ficam no painel "Parametros comerciais da negociacao" (ver
// ParametrosComerciaisProjeto, acima de ResumoComercial). Esta linha so
// mostra o que cada pivo gerou: area, valor negociado ja com os parametros
// do projeto aplicados, custo/ha e versao.
function LinhaPivo(props) {
  const piv = props.pivo;
  const [verHistorico, setVerHistorico] = useState(false);

  return (
    <React.Fragment>
      <tr>
        <td>{piv.numero_pivo}{piv.propriedade ? <div className="muted" style={{ fontSize: '11px' }}>{piv.propriedade}</div> : null}</td>
        <td>{piv.composicao}</td>

        <td><strong>{brl(piv.valor_negociado)}</strong></td>
        <td>{brl(piv.custo_por_hectare)}/ha</td>
        <td className="muted">

        </td>
      </tr>
      {verHistorico ? (
        <tr>
          <td colSpan={6}>
            <HistoricoPivo pivoId={piv.id} token={props.token} />
          </td>
        </tr>
      ) : null}
    </React.Fragment>
  );
}

      <div className="row" style={{ alignItems: 'flex-start', gap: '20px', marginTop: '18px', flexWrap: 'wrap' }}>
        <div style={{ flex: '1 1 280px', minWidth: '260px' }}>
          <p className="muted" style={{ fontWeight: 600, margin: '0 0 6px', color: '#3a3d42' }}>Adutora por diâmetro / classe de pressão</p>

// Parametros comerciais da NEGOCIACAO -- Encargos/Desconto/Taxa Flat/
// Montagem/Serviços Adicionais são UM valor só para o projeto inteiro
// (nunca por pivô/equipamento), igual à aba "Calculo" da Calculadora
// quando o vendedor negocia um desconto para o cliente, não para uma peça
// de equipamento isolada. Editar aqui recalcula o valor negociado de TODOS
// os pivôs do projeto de uma vez.
function ParametrosComerciaisProjeto(props) {
  const p = props.projeto;
  const valoresDoProjeto = function (proj) {
    return {
      encargos_pct: proj.encargos_pct, desconto_pct: proj.desconto_pct, taxa_flat_pct: proj.taxa_flat_pct,
      montagem: proj.montagem, servicos_adicionais: proj.servicos_adicionais
    };
  };
  const [campos, setCampos] = useState(valoresDoProjeto(p));
  const [salvando, setSalvando] = useState(false);
  const salvoRef = React.useRef(valoresDoProjeto(p));

  useEffect(function () {
    const v = valoresDoProjeto(p);
    setCampos(v);
    salvoRef.current = v;
  }, [p.encargos_pct, p.desconto_pct, p.taxa_flat_pct, p.montagem, p.servicos_adicionais]);

  function campo(nome, valor) { setCampos(Object.assign({}, campos, { [nome]: valor })); }

  function salvarSeMudou() {
    const mudou = Object.keys(campos).some(function (k) { return Number(campos[k]) !== Number(salvoRef.current[k]); });
    if (!mudou) return;
    setSalvando(true);
    api('/projetos/' + p.id + '/comercial', { method: 'PUT', body: JSON.stringify(campos) }, props.token)
      .then(function () { salvoRef.current = campos; props.onChange(); })
      .catch(function (e) { alert('Erro ao salvar: ' + e.message); })
      .then(function () { setSalvando(false); });
  }

  const soLeitura = !props.podeEditar;
  const campoComercial = function (nome, rotulo, sufixo) {
    return (
      <div>
        <label>{rotulo}</label>
        <input
          className="campo-mini" type="number" disabled={soLeitura}
          value={campos[nome]}
          onChange={function (e) { campo(nome, e.target.value); }}
          onBlur={salvarSeMudou}
          onKeyDown={function (e) { if (e.key === 'Enter') e.target.blur(); }}
        />{sufixo}
      </div>
    );
  };

  return (
    <div className="panel">
      <div className="row" style={{ justifyContent: 'space-between' }}>
        <h2 style={{ margin: 0 }}>Parâmetros comerciais da negociação</h2>
        {salvando ? <span className="muted" style={{ fontSize: '12px' }}>salvando…</span> : null}
      </div>
      <p className="muted" style={{ marginTop: '4px', marginBottom: '12px' }}>
        Únicos para toda a negociação (não por pivô/equipamento) — mude o número e saia do campo: o valor negociado de todos os pivôs deste projeto recalcula na hora.
      </p>
      <div className="grid-campos">
        {campoComercial('encargos_pct', 'Encargos', '%')}
        {campoComercial('desconto_pct', 'Desconto', '%')}
        {campoComercial('taxa_flat_pct', 'Taxa Flat', '%')}
        {campoComercial('montagem', 'Montagem (R$, total da negociação)', '')}
        {campoComercial('servicos_adicionais', 'Serv. Adicionais (R$, total da negociação)', '')}
      </div>
    </div>
  );
}

function ProjetoDetalhe(props) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);
  const [versao, setVersao] = useState(0);

  const carregar = useCallback(function () {
    api('/projetos/' + props.projetoId + '/resumo', {}, props.token)
      .then(function (d) { setDados(d); if (props.onCarregado) props.onCarregado(d.projeto); })
      .catch(function (e) { setErro(e.message); });
    setVersao(function (v) { return v + 1; });
  }, [props.projetoId, props.token]);

  useEffect(function () { carregar(); }, [props.projetoId]);

  const podeEditar = props.usuario.nivel === 'gerente' || props.usuario.nivel === 'diretor' || props.usuario.nivel === 'vendedor';

  if (erro) return <div className="err">{erro}</div>;
  if (!dados) return <p className="muted">Carregando...</p>;

  const p = dados.projeto;
  const r = dados.resumo;

  return (
    <div>
      <button className="voltar" onClick={props.onVoltar}>&larr; Voltar aos projetos</button>
      <div className="panel">
        <h2>{p.cliente}</h2>
        <p className="muted" style={{ marginBottom: '4px' }}>
          {p.fazenda ? p.fazenda + ' — ' : ''}{p.municipio ? p.municipio + '/' : ''}{p.estado || ''}
          &nbsp;&middot;&nbsp;<span className={'tag ' + p.status}>{formatarStatus(p.status)}</span>
        </p>
        <p className="muted" style={{ margin: 0 }}>
          {r.qtde_pivos} pivô{r.qtde_pivos === 1 ? '' : 's'} &middot; {numero(r.area_total_ha, 1)} ha &middot; {brl(r.valor_total)} negociado &middot; {brl(r.custo_por_hectare_medio)}/ha
        </p>
      </div>

      <ParametrosComerciaisProjeto token={props.token} projeto={p} podeEditar={podeEditar} onChange={carregar} />

      <ResumoTecnico resumo={r} />

      <ResumoComercial projeto={p} pivos={dados.pivos} resumo={r} />

      <EnviarPivo token={props.token} projeto={p} onChange={carregar} />

      <div className="panel">
        <h2>Pivôs</h2>
        <p className="muted" style={{ marginTop: '-6px', marginBottom: '10px' }}>
          Valor negociado de cada pivô, já com os parâmetros comerciais da negociação (acima) aplicados.
        </p>
        <div style={{ overflowX: 'auto' }}>
        <table>
          <thead>
            <tr>
              <th>Nº Pivô</th><th>Composição</th><th>Área</th>
              <th>Valor Negociado</th><th>Custo/ha</th><th>Versão</th>
            </tr>
          </thead>
          <tbody>
            {dados.pivos.map(function (piv) {
              return <LinhaPivo key={piv.id} pivo={piv} token={props.token} podeEditar={podeEditar} onChange={carregar} />;
            })}
            {dados.pivos.length === 0 ? <tr><td colSpan={6} className="muted">Nenhum pivô ainda. Envie a primeira planilha acima.</td></tr> : null}
          </tbody>
        </table>
        </div>
      </div>

      <ArquivosDoProjeto projetoId={props.projetoId} token={props.token} versao={versao} />
    </div>
  );
}

// Modal generico de confirmacao -- em vez de window.confirm nativo, que em
// vários navegadores/contextos nao aparece ou e descartado silenciosamente
// (dando a impressao de que o botao "nao faz nada" ao clicar).
function ModalConfirmacao(props) {
  return (
    <div
      style={{ position: 'fixed', inset: 0, background: 'rgba(25,27,33,.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}
      onClick={function (ev) { ev.stopPropagation(); if (!props.confirmando) props.onCancelar(); }}
    >
      <div className="card" style={{ maxWidth: '360px' }} onClick={function (ev) { ev.stopPropagation(); }}>
        <h1 style={{ fontSize: '16px' }}>{props.titulo}</h1>
        <p className="sub">{props.mensagem}</p>
        {props.erro ? <div className="err">{props.erro}</div> : null}
        <div className="row" style={{ justifyContent: 'flex-end', marginTop: '16px' }}>
          <button className="ghost" onClick={props.onCancelar} disabled={props.confirmando}>Cancelar</button>
          <button style={{ background: '#9f1239' }} onClick={props.onConfirmar} disabled={props.confirmando}>
            {props.confirmando ? 'Excluindo...' : 'Excluir'}
          </button>
        </div>
      </div>
    </div>
  );
}

function BotaoExcluirProjeto(props) {
  const [confirmando, setConfirmando] = useState(false);
  const [excluindo, setExcluindo] = useState(false);
  const [erro, setErro] = useState(null);

  function excluir() {
    setExcluindo(true);
    setErro(null);
    api('/projetos/' + props.projetoId, { method: 'DELETE' }, props.token)
      .then(function () { setConfirmando(false); setExcluindo(false); props.onExcluido(); })
      .catch(function (e) { setErro(e.message); setExcluindo(false); });
  }

  return (
    <React.Fragment>
      <button className="mini ghost" title="Excluir projeto" onClick={function (ev) { ev.stopPropagation(); setConfirmando(true); }}>
        🗑️
      </button>
      {confirmando ? (
        <ModalConfirmacao
          titulo="Excluir projeto?"
          mensagem={'Isso remove "' + (props.nomeCliente || 'este projeto') + '" e todos os seus pivôs e arquivos. Essa ação não pode ser desfeita.'}
          confirmando={excluindo}
          erro={erro}
          onConfirmar={excluir}
          onCancelar={function () { setConfirmando(false); setErro(null); }}
        />
      ) : null}
    </React.Fragment>
  );
}

// Icone de upload rapido na propria lista de projetos -- adiciona (ou, se o
// numero do pivo ja existir no projeto, atualiza como nova versao) uma
// planilha sem precisar abrir o projeto primeiro.
function BotaoUploadRapido(props) {
  const inputRef = React.useRef(null);
  const [status, setStatus] = useState(null);
  const [enviando, setEnviando] = useState(false);

  async function aoSelecionarArquivos(ev) {
    const arquivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if (arquivos.length === 0) return;
    setEnviando(true);
    let pastaBase = null;
    if (SUPORTA_PASTA_LOCAL) {
      try { pastaBase = await obterPastaBase(); }
      catch (e) { setStatus('Pasta local não selecionada -- enviando só pra o sistema.'); }
    }
    for (const arquivo of arquivos) {
      try {
        setStatus('Lendo ' + arquivo.name + '...');
        const buffer = await arquivo.arrayBuffer();
        const dado = extrairPivoDoArrayBuffer(buffer, arquivo.name);

        let caminhoLocal = null, revisao = 1;
        if (pastaBase) {
          const r = await organizarArquivoLocal(pastaBase, {
            cliente: props.projeto.cliente, estado: props.projeto.estado,
            municipio: props.projeto.municipio, fazenda: props.projeto.fazenda
          }, arquivo, arquivo.name);
          caminhoLocal = r.caminhoRelativo; revisao = r.revisao;
        }

        const pivo = await api('/pivos', {
          method: 'POST', body: JSON.stringify(Object.assign({}, dado, {
            projeto_id: props.projeto.id, caminho_local: caminhoLocal, revisao: revisao
          }))
        }, props.token);

        const fd = new FormData();
        fd.append('arquivo', arquivo, arquivo.name);
        fd.append('projeto_id', props.projeto.id);
        fd.append('pivo_id', pivo.id);
        fd.append('tipo', 'pivo');
        await api('/arquivos', { method: 'POST', body: fd }, props.token);

        setStatus(dado.numero_pivo + (pivo.nova_versao ? ' → v' + pivo.revisao + ' salva.' : ' adicionado.'));
      } catch (e) {
        setStatus('Erro em ' + arquivo.name + ': ' + e.message);
      }
    }
    setEnviando(false);
    props.onChange();
  }

  return (
    <span className="row" onClick={function (ev) { ev.stopPropagation(); }} style={{ flexWrap: 'nowrap' }}>
      <button
        className="mini ghost"
        title="Adicionar ou atualizar planilha de pivô deste projeto"
        disabled={enviando}
        onClick={function (ev) { ev.stopPropagation(); inputRef.current.click(); }}
      >
        {enviando ? '...' : '⬆️'}
      </button>
      <input ref={inputRef} type="file" accept=".xlsb" multiple style={{ display: 'none' }} onChange={aoSelecionarArquivos} />
      {status ? <span className="muted" style={{ fontSize: '11px', maxWidth: '150px' }}>{status}</span> : null}
    </span>
  );
}

function Dashboard(props) {
  const [kpis, setKpis] = useState(null);
  const [escopo, setEscopo] = useState('');
  const [projetos, setProjetos] = useState([]);
  const [erro, setErro] = useState(null);

  const carregar = useCallback(function () {
    api('/dashboard', {}, props.token).then(function (d) { setKpis(d.kpis); setEscopo(d.escopo); }).catch(function (e) { setErro(e.message); });
    api('/projetos', {}, props.token).then(setProjetos).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  return (
    <div>
      {erro ? <div className="err">{erro}</div> : null}
      <h2 style={{ margin: '0 0 12px' }}>Dashboard geral &middot; <span className="muted" style={{ fontWeight: 400, fontSize: '13px' }}>todas as negociações no seu escopo</span></h2>
      <div className="kpis">
        <div className="kpi"><span>Total de projetos</span><strong>{kpis ? kpis.total : '-'}</strong></div>
        <div className="kpi"><span>Em negociação</span><strong>{kpis ? kpis.em_negociacao : '-'}</strong></div>
        <div className="kpi"><span>Aprovados</span><strong>{kpis ? kpis.aprovados : '-'}</strong></div>
        <div className="kpi"><span>Pivôs</span><strong>{kpis ? kpis.qtde_pivos : '-'}</strong></div>
        <div className="kpi"><span>Área total</span><strong>{kpis ? numero(kpis.area_total_ha, 1) + ' ha' : '-'}</strong></div>
        <div className="kpi"><span>Valor total</span><strong>{kpis ? brl(kpis.valor_total) : '-'}</strong></div>
      </div>

      <div className="panel">
        <h2>Projetos ({projetos.length}) &middot; <span className="muted">escopo: {escopo || '-'}</span></h2>
        <p className="muted" style={{ margin: '-6px 0 10px' }}>Clique em um projeto para ver a análise comercial (dashboard por negociação), com todos os seus pivôs.</p>
        <div style={{ overflowX: 'auto' }}>
        <table>
          <thead>
            <tr><th>Cliente</th><th>Local</th><th>Vendedor</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody>
            {projetos.map(function (p) {
              return (
                <tr key={p.id} className="clicavel" onClick={function () { props.onAbrirProjeto(p.id); }}>
                  <td style={{ fontWeight: 600 }}>{p.cliente}</td>
                  <td>{p.municipio ? p.municipio + '/' : ''}{p.estado || '-'}</td>
                  <td>{p.vendedor_nome || '-'}</td>
                  <td><span className={'tag ' + p.status}>{formatarStatus(p.status)}</span></td>
                  <td>
                    <div className="row" style={{ flexWrap: 'nowrap' }}>
                      <button className="mini ghost" title="Abrir análise comercial deste projeto" onClick={function (ev) { ev.stopPropagation(); props.onAbrirProjeto(p.id); }}>
                        Abrir
                      </button>
                      <BotaoUploadRapido projeto={p} token={props.token} onChange={carregar} />
                      {props.usuario.nivel === 'diretor' ? <BotaoExcluirProjeto projetoId={p.id} nomeCliente={p.cliente} token={props.token} onExcluido={carregar} /> : null}
                    </div>
                  </td>
                </tr>
              );
            })}
            {projetos.length === 0 ? <tr><td colSpan={5} className="muted">Nenhum projeto no seu escopo.</td></tr> : null}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function Pendentes(props) {
  const [lista, setLista] = useState([]);
  const [erro, setErro] = useState(null);
  const [status, setStatus] = useState(null);

  const carregar = useCallback(function () {
    api('/arquivos/pendentes', {}, props.token).then(setLista).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  async function aceitar(a) {
    setStatus('Baixando ' + a.nome + '...');
    try {
      if (SUPORTA_PASTA_LOCAL) {
        const pastaBase = await obterPastaBase();
        const resp = await fetch(a.caminho);
        const blob = await resp.blob();
        const proj = a.projetos || {};
        await organizarArquivoLocal(pastaBase, proj, blob, a.nome);
      }
      await api('/arquivos/' + a.id + '/aceitar', { method: 'PUT' }, props.token);
      setStatus(a.nome + ' aceito e organizado na sua pasta local.');
      carregar();
      if (props.onMudouContagem) props.onMudouContagem();
    } catch (e) {
      setStatus('Erro: ' + e.message);
    }
  }
  function recusar(a) {
    if (!confirm('Recusar ' + a.nome + '?')) return;
    api('/arquivos/' + a.id + '/recusar', { method: 'PUT' }, props.token).then(function () { carregar(); if (props.onMudouContagem) props.onMudouContagem(); }).catch(function (e) { setErro(e.message); });
  }

  return (
    <div className="panel">
      <h2>Arquivos pendentes de aceite ({lista.length})</h2>
      {erro ? <div className="err">{erro}</div> : null}
      {status ? <p className="muted">{status}</p> : null}
      {!SUPORTA_PASTA_LOCAL ? <p className="muted">Este navegador não organiza a pasta local automaticamente (use Chrome/Edge) -- aceitar ainda marca o arquivo como aprovado.</p> : null}
      <table>
        <thead><tr><th>Arquivo</th><th>Projeto</th><th>Enviado em</th><th>Ações</th></tr></thead>
        <tbody>
          {lista.map(function (a) {
            const proj = a.projetos || {};
            return (
              <tr key={a.id}>
                <td>{a.nome}</td>
                <td>{proj.cliente || '-'}</td>
                <td className="muted">{new Date(a.created_at).toLocaleString('pt-BR')}</td>
                <td>
                  <div className="row">
                    <button className="mini" onClick={function () { aceitar(a); }}>Aceitar</button>
                    <button className="mini perigo" onClick={function () { recusar(a); }}>Recusar</button>
                  </div>
                </td>
              </tr>
            );
          })}
          {lista.length === 0 ? <tr><td colSpan={4} className="muted">Nada pendente.</td></tr> : null}
        </tbody>
      </table>
    </div>
  );
}

function AdminUsuarios(props) {
  const [usuarios, setUsuarios] = useState([]);
  const [erro, setErro] = useState(null);

  useEffect(function () {
    api('/usuarios', {}, props.token).then(setUsuarios).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  return (
    <div className="panel">
      <h2>Usuários ({usuarios.length})</h2>
      {erro ? <div className="err">{erro}</div> : null}
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Região</th></tr></thead>
        <tbody>
          {usuarios.map(function (u) {
            return <tr key={u.id}><td>{u.nome}</td><td>{u.email}</td><td>{u.nivel}</td><td>{u.regiao || '-'}</td></tr>;
          })}
        </tbody>
      </table>
    </div>

}

function AdminConfigFiscal(props) {
  const [estados, setEstados] = useState([]);
  const [globais, setGlobais] = useState([]);
  const [erro, setErro] = useState(null);
  const [msg, setMsg] = useState(null);

  const carregar = useCallback(function () {
    api('/config/fiscal', {}, props.token).then(function (d) { setEstados(d.estados); setGlobais(d.globais); }).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  function salvarEstado(estado, valor) {
    api('/config/fiscal/' + estado, { method: 'PUT', body: JSON.stringify({ icms_pct: Number(valor) }) }, props.token)
      .then(function () { setMsg(estado + ' atualizado.'); carregar(); })
      .catch(function (e) { setErro(e.message); });
  }
  function salvarGlobal(chave, valor) {
    api('/config/global/' + chave, { method: 'PUT', body: JSON.stringify({ valor: Number(valor) }) }, props.token)
      .then(function () { setMsg(chave + ' atualizado.'); carregar(); })
      .catch(function (e) { setErro(e.message); });
  }

  return (
    <div>
      <div className="panel">
        <h2>Constantes globais (fórmula de desconto)</h2>
        {erro ? <div className="err">{erro}</div> : null}
        {msg ? <div className="ok">{msg}</div> : null}
        <table>
          <thead><tr><th>Chave</th><th>Descrição</th><th>Valor</th></tr></thead>
          <tbody>
            {globais.map(function (g) {
              return (
                <tr key={g.chave}>
                  <td>{g.chave}</td>
                  <td className="muted">{g.descricao}</td>
                  <td>
                    <div className="row">
                      <input className="campo-mini" type="number" step="0.01" defaultValue={g.valor} id={'glob-' + g.chave} />
                      <button className="mini ghost" onClick={function () { salvarGlobal(g.chave, document.getElementById('glob-' + g.chave).value); }}>Salvar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="panel">
        <h2>Tabela de desconto (ICMS por estado)</h2>
        <table>
          <thead><tr><th>Estado</th><th>ICMS %</th></tr></thead>
          <tbody>
            {estados.map(function (e) {
              return (
                <tr key={e.estado}>
                  <td>{e.estado}</td>
                  <td>
                    <div className="row">
                      <input className="campo-mini" type="number" step="0.1" defaultValue={e.icms_pct} id={'icms-' + e.estado} />
                      <button className="mini ghost" onClick={function () { salvarEstado(e.estado, document.getElementById('icms-' + e.estado).value); }}>Salvar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Admin(props) {
  return (
    <div>
      <AdminUsuarios token={props.token} />
      <AdminConfigFiscal token={props.token} />
    </div>
  );
}

function App() {
  const [token, setToken] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [tela, setTela] = useState('dashboard');
  const [qtdePendentes, setQtdePendentes] = useState(0);
  const [projetoAberto, setProjetoAberto] = useState(null);
  const [projetoAtual, setProjetoAtual] = useState(null);
  const [dashboardKey, setDashboardKey] = useState(0);

  function abrirProjeto(id) {
    setProjetoAtual(null);
    setProjetoAberto(id);
  }
  function fecharProjeto() {
    setProjetoAberto(null);
    setProjetoAtual(null);
    setDashboardKey(function (k) { return k + 1; });
  }

  useEffect(function () {
    const t = localStorage.getItem('pivot_token');
    const u = localStorage.getItem('pivot_usuario');
    if (t && u) { setToken(t); setUsuario(JSON.parse(u)); }
  }, []);

  const atualizarContagemPendentes = useCallback(function () {
    if (!token) return;
    api('/arquivos/pendentes', {}, token).then(function (d) { setQtdePendentes(d.length); }).catch(function () {});
  }, [token]);

  useEffect(function () { atualizarContagemPendentes(); }, [atualizarContagemPendentes]);

  function onLogin(t, u) {
    localStorage.setItem('pivot_token', t);
    localStorage.setItem('pivot_usuario', JSON.stringify(u));
    setToken(t); setUsuario(u);
  }
  function onLogout() {
    if (token) api('/logout', { method: 'POST' }, token).catch(function () {});
    localStorage.removeItem('pivot_token');
    localStorage.removeItem('pivot_usuario');
    setToken(null); setUsuario(null);
  }

  if (!token || !usuario) return <Login onLogin={onLogin} />;

  const podeAdmin = usuario.nivel === 'gerente' || usuario.nivel === 'diretor';
  const podeReceberArquivo = usuario.nivel === 'gerente' || usuario.nivel === 'diretor';

  function irPara(novaTela) {
    setProjetoAberto(null);
    setTela(novaTela);
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div>
          <div className="brand">PIVOT Deal Manager</div>
          <div className="brand-sub">GESTÃO DE PROPOSTAS</div>
        </div>

        <NovoProjeto
          token={token}
          onChange={function () { setDashboardKey(function (k) { return k + 1; }); }}
          onAbrir={function (id) { abrirProjeto(id); setTela('dashboard'); }}
        />

        <nav className="secao">
          <p className="titulo">Acompanhar</p>
          <button className={(tela === 'dashboard' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('dashboard'); }}>
            <span>🏠</span> Dashboard geral
          </button>
          {podeReceberArquivo ? (
            <button className={(tela === 'pendentes' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('pendentes'); }}>
              <span>📥</span> Pendentes
              {qtdePendentes > 0 ? <span className="badge-inline">{qtdePendentes}</span> : null}
            </button>
          ) : null}
        </nav>

        {podeAdmin ? (
          <nav className="secao">
            <p className="titulo">Organizar</p>
            <button className={(tela === 'admin' && !projetoAberto) ? 'ativo' : ''} onClick={function () { setProjetoAtual(null); irPara('admin'); }}>
              <span>⚙️</span> Usuários &amp; fiscal
            </button>
          </nav>
        ) : null}

        {projetoAberto ? (
          <nav className="secao">
            <p className="titulo">Negociação aberta</p>
            <button className="ativo">
              <span>📊</span> {projetoAtual ? projetoAtual.cliente : 'Carregando...'}
            </button>
          </nav>
        ) : null}

        <div className="perfil">
          <div className="avatar">{iniciais(usuario.nome)}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: '13px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{usuario.nome}</div>
            <div className="muted" style={{ fontSize: '11px', textTransform: 'capitalize' }}>{usuario.nivel}</div>
          </div>
          <button className="mini ghost" onClick={onLogout}>Sair</button>
        </div>
      </aside>

      <div className="conteudo">
        <main>
          {projetoAberto ? (
            <ProjetoDetalhe
              projetoId={projetoAberto}
              token={token}
              usuario={usuario}
              onVoltar={fecharProjeto}
              onCarregado={setProjetoAtual}
            />
          ) : (
            <React.Fragment>
              {tela === 'admin' && podeAdmin ? <Admin token={token} /> : null}
              {tela === 'pendentes' && podeReceberArquivo ? <Pendentes token={token} onMudouContagem={atualizarContagemPendentes} /> : null}
              {tela === 'dashboard' ? <Dashboard key={dashboardKey} token={token} usuario={usuario} onAbrirProjeto={setProjetoAberto} /> : null}
            </React.Fragment>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
