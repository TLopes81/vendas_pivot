<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIVOT Deal Manager WEB</title>
<style>
  :root { --azul:#0b2545; --azul2:#006591; --cinza:#f4f7fb; --borda:#dbe4ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--cinza); color:#171c20; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:14px; padding:28px; width:100%; max-width:380px; box-shadow:0 8px 24px rgba(11,37,69,.06); }
  .card h1 { margin:0 0 4px; font-size:20px; }
  .card p.sub { margin:0 0 20px; font-size:12px; color:#5c6b78; }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; height:42px; border:1px solid var(--borda); border-radius:9px; padding:0 12px; font-size:14px; background:#fbfdff; }
  button { height:42px; border:0; border-radius:9px; background:var(--azul2); color:#fff; font-weight:600; font-size:14px; cursor:pointer; padding:0 16px; }
  button.ghost { background:#fff; color:var(--azul2); border:1px solid var(--azul2); }
  button.mini { height:30px; font-size:12px; padding:0 10px; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .err { background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; padding:10px; border-radius:9px; font-size:12px; margin-top:14px; }
  .ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; padding:10px; border-radius:9px; font-size:12px; margin-top:14px; }
  header { background:var(--azul); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  header .who { font-size:12px; opacity:.85; }
  nav.tabs { display:flex; gap:6px; }
  nav.tabs button { height:34px; background:rgba(255,255,255,.08); color:#fff; font-size:12px; padding:0 14px; }
  nav.tabs button.ativo { background:#fff; color:var(--azul); }
  main { padding:22px; max-width:1200px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:14px; }
  .kpi span { display:block; font-size:11px; text-transform:uppercase; color:#6b7a82; letter-spacing:.03em; }
  .kpi strong { font-size:22px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--borda); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid #eef3f7; }
  th { background:#f8fbfe; font-size:11px; text-transform:uppercase; color:#6b7a82; }
  tr.clicavel { cursor:pointer; }
  tr.clicavel:hover { background:#f8fbfe; }
  .tag { font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; }
  .tag.em_negociacao { background:#fff5e0; color:#8c520a; }
  .tag.aprovado { background:#ecfdf5; color:#065f46; }
  .tag.reprovado { background:#fff1f2; color:#9f1239; }
  .panel { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:15px; }
  .muted { font-size:12px; color:#6b7a82; }
  .desconto-input { width:70px; height:30px; padding:0 8px; text-align:right; }
  .voltar { background:none; color:var(--azul2); height:auto; padding:0; font-size:13px; font-weight:600; margin-bottom:12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = '';

function api(path, options, token) {
  const opts = options || {};
  const headers = Object.assign({}, opts.headers || {});
  if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, Object.assign({}, opts, { headers: headers })).then(function (r) {
    return r.text().then(function (t) {
      let data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = { erro: t }; }
      if (!r.ok) throw new Error((data && data.erro) || ('Falha HTTP ' + r.status));
      return data;
    });
  });
}
function brl(v) {
  return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function numero(v, casas) {
  return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0 });
}

function Login(props) {
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState(null);
  const [carregando, setCarregando] = useState(false);

  function entrar(e) {
    e.preventDefault();
    setErro(null); setCarregando(true);
    api('/login', { method: 'POST', body: JSON.stringify({ email: email, senha: senha }) })
      .then(function (d) { props.onLogin(d.token, d.usuario); })
      .catch(function (err) { setErro(err.message); })
      .then(function () { setCarregando(false); });
  }

  return (
    <div className="login-wrap">
      <form className="card" onSubmit={entrar}>
        <h1>PIVOT Deal Manager</h1>
        <p className="sub">Hierarquia: diretor &gt; gerente &gt; vendedor</p>
        <label>E-mail</label>
        <input type="email" value={email} onChange={function (e) { setEmail(e.target.value); }} placeholder="nome.sobrenome@pivot.com.br" required />
        <label>Senha</label>
        <input type="password" value={senha} onChange={function (e) { setSenha(e.target.value); }} required />
        <div style={{ height: '16px' }} />
        <button type="submit" style={{ width: '100%' }} disabled={carregando}>
          {carregando ? 'Entrando...' : 'Entrar'}
        </button>
        {erro ? <div className="err">{erro}</div> : null}
      </form>
    </div>
  );
}

function NovoProjeto(props) {
  const [cliente, setCliente] = useState('');
  const [estado, setEstado] = useState('');
  const [municipio, setMunicipio] = useState('');
  const [fazenda, setFazenda] = useState('');
  const [msg, setMsg] = useState(null);

  function salvar(e) {
    e.preventDefault();
    api('/projetos', { method: 'POST', body: JSON.stringify({ cliente: cliente, estado: estado, municipio: municipio, fazenda: fazenda }) }, props.token)
      .then(function (p) {
        setMsg('Projeto criado. ID: ' + p.id + ' (use esse ID no script local extrator_pivot.py --projeto-id)');
        setCliente(''); setEstado(''); setMunicipio(''); setFazenda('');
        props.onChange();
      })
      .catch(function (err) { setMsg('Erro: ' + err.message); });
  }
  return (
    <div className="panel">
      <h2>Novo projeto</h2>
      <p className="muted" style={{ marginTop: '-6px' }}>
        O projeto só guarda o cliente/local aqui. Os pivôs (dados técnicos e valores) entram
        via o script local de extração, que lê os arquivos .xlsb e envia pra este projeto.
      </p>
      <form onSubmit={salvar} className="row">
        <input placeholder="Cliente" value={cliente} onChange={function (e) { setCliente(e.target.value); }} required style={{ maxWidth: '220px' }} />
        <input placeholder="Estado (UF)" value={estado} onChange={function (e) { setEstado(e.target.value.toUpperCase()); }} maxLength={2} style={{ maxWidth: '90px' }} />
        <input placeholder="Município" value={municipio} onChange={function (e) { setMunicipio(e.target.value); }} style={{ maxWidth: '180px' }} />
        <input placeholder="Fazenda/Propriedade" value={fazenda} onChange={function (e) { setFazenda(e.target.value); }} style={{ maxWidth: '200px' }} />
        <button type="submit">Criar</button>
      </form>
      {msg ? <p className="muted" style={{ marginTop: '10px' }}>{msg}</p> : null}
    </div>
  );
}

function LinhaPivo(props) {
  const piv = props.pivo;
  const [desconto, setDesconto] = useState(piv.desconto_pct);
  const [salvando, setSalvando] = useState(false);

  function salvarDesconto() {
    setSalvando(true);
    api('/pivos/' + piv.id + '/desconto', { method: 'PUT', body: JSON.stringify({ desconto_pct: Number(desconto) }) }, props.token)
      .then(function () { props.onChange(); })
      .catch(function (e) { alert('Erro ao atualizar desconto: ' + e.message); })
      .then(function () { setSalvando(false); });
  }

  return (
    <tr>
      <td>{piv.numero_pivo}</td>
      <td>{piv.composicao}</td>
      <td>{numero(piv.area_irrigada_ha, 1)} ha</td>
      <td>
        <div className="row">
          <input className="desconto-input" type="number" step="1" value={desconto}
                 onChange={function (e) { setDesconto(e.target.value); }} disabled={!props.podeEditar} />
          <span className="muted">%</span>
          {props.podeEditar ? (
            <button className="mini ghost" onClick={salvarDesconto} disabled={salvando || Number(desconto) === piv.desconto_pct}>
              {salvando ? '...' : 'Salvar'}
            </button>
          ) : null}
        </div>
      </td>
      <td><strong>{brl(piv.valor_negociado)}</strong></td>
      <td>{brl(piv.custo_por_hectare)}/ha</td>
      <td className="muted">v{piv.revisao}</td>
    </tr>
  );
}

function ProjetoDetalhe(props) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);

  const carregar = useCallback(function () {
    api('/projetos/' + props.projetoId + '/resumo', {}, props.token).then(setDados).catch(function (e) { setErro(e.message); });
  }, [props.projetoId, props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  const podeEditar = props.usuario.nivel === 'gerente' || props.usuario.nivel === 'diretor' || props.usuario.nivel === 'vendedor';

  if (erro) return <div className="err">{erro}</div>;
  if (!dados) return <p className="muted">Carregando...</p>;

  const p = dados.projeto;
  const r = dados.resumo;

  return (
    <div>
      <button className="voltar" onClick={props.onVoltar}>&larr; Voltar aos projetos</button>
      <div className="panel">
        <h2>{p.cliente}</h2>
        <p className="muted">
          {p.fazenda ? p.fazenda + ' — ' : ''}{p.municipio ? p.municipio + '/' : ''}{p.estado || ''}
          &nbsp;&middot;&nbsp;<span className={'tag ' + p.status}>{p.status}</span>
        </p>
        <div className="kpis">
          <div className="kpi"><span>Pivôs</span><strong>{r.qtde_pivos}</strong></div>
          <div className="kpi"><span>Área total</span><strong>{numero(r.area_total_ha, 1)} ha</strong></div>
          <div className="kpi"><span>Valor total negociado</span><strong>{brl(r.valor_total)}</strong></div>
          <div className="kpi"><span>Custo médio/ha</span><strong>{brl(r.custo_por_hectare_medio)}</strong></div>
        </div>
      </div>
      <div className="panel">
        <h2>Pivôs</h2>
        <table>
          <thead>
            <tr><th>Nº Pivô</th><th>Composição</th><th>Área</th><th>Desconto</th><th>Valor Negociado</th><th>Custo/ha</th><th>Versão</th></tr>
          </thead>
          <tbody>
            {dados.pivos.map(function (piv) {
              return <LinhaPivo key={piv.id} pivo={piv} token={props.token} podeEditar={podeEditar} onChange={carregar} />;
            })}
            {dados.pivos.length === 0 ? <tr><td colSpan={7} className="muted">Nenhum pivô ainda. Rode o extrator_pivot.py apontando pra este projeto.</td></tr> : null}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Dashboard(props) {
  const [kpis, setKpis] = useState(null);
  const [escopo, setEscopo] = useState('');
  const [projetos, setProjetos] = useState([]);
  const [projetoAberto, setProjetoAberto] = useState(null);
  const [erro, setErro] = useState(null);

  const carregar = useCallback(function () {
    api('/dashboard', {}, props.token).then(function (d) { setKpis(d.kpis); setEscopo(d.escopo); }).catch(function (e) { setErro(e.message); });
    api('/projetos', {}, props.token).then(setProjetos).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  function excluir(id, ev) {
    ev.stopPropagation();
    if (!confirm('Excluir este projeto e todos os seus pivôs?')) return;
    api('/projetos/' + id, { method: 'DELETE' }, props.token).then(carregar).catch(function (e) { setErro(e.message); });
  }

  if (projetoAberto) {
    return <ProjetoDetalhe projetoId={projetoAberto} token={props.token} usuario={props.usuario} onVoltar={function () { setProjetoAberto(null); carregar(); }} />;
  }

  return (
    <div>
      {erro ? <div className="err">{erro}</div> : null}
      <div className="kpis">
        <div className="kpi"><span>Total de projetos</span><strong>{kpis ? kpis.total : '-'}</strong></div>
        <div className="kpi"><span>Em negociação</span><strong>{kpis ? kpis.em_negociacao : '-'}</strong></div>
        <div className="kpi"><span>Aprovados</span><strong>{kpis ? kpis.aprovados : '-'}</strong></div>
        <div className="kpi"><span>Pivôs</span><strong>{kpis ? kpis.qtde_pivos : '-'}</strong></div>
        <div className="kpi"><span>Área total</span><strong>{kpis ? numero(kpis.area_total_ha, 1) + ' ha' : '-'}</strong></div>
        <div className="kpi"><span>Valor total</span><strong>{kpis ? brl(kpis.valor_total) : '-'}</strong></div>
      </div>

      <NovoProjeto token={props.token} onChange={carregar} />

      <div className="panel">
        <h2>Projetos ({projetos.length}) &middot; <span className="muted">escopo: {escopo || '-'}</span></h2>
        <table>
          <thead>
            <tr><th>Cliente</th><th>Local</th><th>Vendedor</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody>
            {projetos.map(function (p) {
              return (
                <tr key={p.id} className="clicavel" onClick={function () { setProjetoAberto(p.id); }}>
                  <td>{p.cliente}</td>
                  <td>{p.municipio ? p.municipio + '/' : ''}{p.estado || '-'}</td>
                  <td>{p.vendedor_nome || '-'}</td>
                  <td><span className={'tag ' + p.status}>{p.status}</span></td>
                  <td>
                    {props.usuario.nivel === 'diretor' ? <button className="mini ghost" onClick={function (ev) { excluir(p.id, ev); }}>Excluir</button> : null}
                  </td>
                </tr>
              );
            })}
            {projetos.length === 0 ? <tr><td colSpan={5} className="muted">Nenhum projeto no seu escopo.</td></tr> : null}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AdminUsuarios(props) {
  const [usuarios, setUsuarios] = useState([]);
  const [erro, setErro] = useState(null);

  useEffect(function () {
    api('/usuarios', {}, props.token).then(setUsuarios).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  return (
    <div className="panel">
      <h2>Usuários ({usuarios.length})</h2>
      {erro ? <div className="err">{erro}</div> : null}
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Região</th></tr></thead>
        <tbody>
          {usuarios.map(function (u) {
            return <tr key={u.id}><td>{u.nome}</td><td>{u.email}</td><td>{u.nivel}</td><td>{u.regiao || '-'}</td></tr>;
          })}
        </tbody>
      </table>
    </div>
  );
}

function AdminConfigFiscal(props) {
  const [estados, setEstados] = useState([]);
  const [globais, setGlobais] = useState([]);
  const [erro, setErro] = useState(null);
  const [msg, setMsg] = useState(null);

  const carregar = useCallback(function () {
    api('/config/fiscal', {}, props.token).then(function (d) { setEstados(d.estados); setGlobais(d.globais); }).catch(function (e) { setErro(e.message); });
  }, [props.token]);

  useEffect(function () { carregar(); }, [carregar]);

  function salvarEstado(estado, valor) {
    api('/config/fiscal/' + estado, { method: 'PUT', body: JSON.stringify({ icms_pct: Number(valor) }) }, props.token)
      .then(function () { setMsg(estado + ' atualizado.'); carregar(); })
      .catch(function (e) { setErro(e.message); });
  }
  function salvarGlobal(chave, valor) {
    api('/config/global/' + chave, { method: 'PUT', body: JSON.stringify({ valor: Number(valor) }) }, props.token)
      .then(function () { setMsg(chave + ' atualizado.'); carregar(); })
      .catch(function (e) { setErro(e.message); });
  }

  return (
    <div>
      <div className="panel">
        <h2>Constantes globais (fórmula de desconto)</h2>
        {erro ? <div className="err">{erro}</div> : null}
        {msg ? <div className="ok">{msg}</div> : null}
        <table>
          <thead><tr><th>Chave</th><th>Descrição</th><th>Valor</th></tr></thead>
          <tbody>
            {globais.map(function (g) {
              return (
                <tr key={g.chave}>
                  <td>{g.chave}</td>
                  <td className="muted">{g.descricao}</td>
                  <td>
                    <div className="row">
                      <input className="desconto-input" type="number" step="0.01" defaultValue={g.valor} id={'glob-' + g.chave} />
                      <button className="mini ghost" onClick={function () { salvarGlobal(g.chave, document.getElementById('glob-' + g.chave).value); }}>Salvar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="panel">
        <h2>Tabela de desconto (ICMS por estado)</h2>
        <table>
          <thead><tr><th>Estado</th><th>ICMS %</th></tr></thead>
          <tbody>
            {estados.map(function (e) {
              return (
                <tr key={e.estado}>
                  <td>{e.estado}</td>
                  <td>
                    <div className="row">
                      <input className="desconto-input" type="number" step="0.1" defaultValue={e.icms_pct} id={'icms-' + e.estado} />
                      <button className="mini ghost" onClick={function () { salvarEstado(e.estado, document.getElementById('icms-' + e.estado).value); }}>Salvar</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Admin(props) {
  return (
    <div>
      <AdminUsuarios token={props.token} />
      <AdminConfigFiscal token={props.token} />
    </div>
  );
}

function App() {
  const [token, setToken] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [tela, setTela] = useState('dashboard');

  useEffect(function () {
    const t = localStorage.getItem('pivot_token');
    const u = localStorage.getItem('pivot_usuario');
    if (t && u) { setToken(t); setUsuario(JSON.parse(u)); }
  }, []);

  function onLogin(t, u) {
    localStorage.setItem('pivot_token', t);
    localStorage.setItem('pivot_usuario', JSON.stringify(u));
    setToken(t); setUsuario(u);
  }
  function onLogout() {
    if (token) api('/logout', { method: 'POST' }, token).catch(function () {});
    localStorage.removeItem('pivot_token');
    localStorage.removeItem('pivot_usuario');
    setToken(null); setUsuario(null);
  }

  if (!token || !usuario) return <Login onLogin={onLogin} />;

  const podeAdmin = usuario.nivel === 'gerente' || usuario.nivel === 'diretor';

  return (
    <div>
      <header>
        <div>
          <strong>PIVOT Deal Manager WEB</strong>
          <div className="who">{usuario.nome} &middot; {usuario.email} &middot; nivel: {usuario.nivel}</div>
        </div>
        <div className="row">
          <nav className="tabs">
            <button className={tela === 'dashboard' ? 'ativo' : ''} onClick={function () { setTela('dashboard'); }}>Dashboard</button>
            {podeAdmin ? <button className={tela === 'admin' ? 'ativo' : ''} onClick={function () { setTela('admin'); }}>Admin</button> : null}
          </nav>
          <button className="ghost" onClick={onLogout}>Sair</button>
        </div>
      </header>
      <main>
        {tela === 'admin' && podeAdmin ? <Admin token={token} /> : <Dashboard token={token} usuario={usuario} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
